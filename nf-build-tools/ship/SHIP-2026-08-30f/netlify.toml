# ── 29 Aug (pass212) · THE SQUARESPACE PAGES ─────────────────────────────────
# Google's index of this domain is still the previous build, and every one of
# those pages now returns 404 — verified by fetching them, not assumed. Eight
# confirmed, listed with the titles Google still holds for them:
#
#   /our-values        Our Values | Coffee with Purpose
#   /our-impact        Our Impact | Coffee That Gives Back
#   /roasted-coffee    Roasted Coffee | Bold, Impact-Driven Brews
#   /roasters          Roasters | No Middlemen. Just Great Coffee
#   /workplaces        Workplaces | Fresh Coffee. Real Impact
#   /hotels-and-cafes  Hotels & Cafes | Serve Great Coffee That Stands for More
#   /batang-toru       Batang Toru Coffee | Jungle-Grown & Woman-Powered
#   /arakan-mountains  Arakan Mountains Coffee | Wild-Grown with Purpose
#
# A 404 tells a crawler to drop the page and everything it had earned. A 301
# tells it where the page went and to bring that with it. Each one points at the
# nearest live route rather than at the home page, because a redirect to
# something unrelated is read as a soft 404 and loses the same value it was
# meant to keep.
#
# The two origin redirects are approximate — one old page about one coffee,
# pointed at a route about four. Stage 3 gives each origin its own URL and makes
# them exact.
#
# The last two are INFERRED from the naming convention of the two confirmed
# origin pages, not observed in an index. A redirect for a URL that never
# existed is harmless; a missing one is not.
[[redirects]]
  from = "/our-values"
  to = "/"
  status = 301
  force = true
