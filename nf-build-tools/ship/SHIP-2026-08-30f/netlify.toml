# ── 28 Aug · what a browser is allowed to do with this page ──────────────────
# Alex: "i want their to be guardrails that throw people off from being copy
# cats, i.e. copying the custom tablets."
#
# frame-ancestors is the one that actually stops a category of theft rather than
# inconveniencing it: without it, anyone can put nofilter.sg inside an <iframe>
# on their own domain, wrap it in their branding and present the whole build as
# their work — no copying required, and it is the laziest and most common form
# of it. X-Frame-Options says the same thing to older browsers. Both are
# declarations the browser enforces; neither can be worked around from the
# copying end.
#
# What is deliberately NOT here: a full Content-Security-Policy. This page runs
# entirely on inline script and style, so a default-src policy needs every block
# hashed or 'unsafe-inline' — the first is a build step we do not have yet and
# the second protects nothing. Shipping a wrong one white-screens the site. It
# is on the list, after launch, done properly.
#
# Also NOT here: any Cross-Origin-Resource-Policy on the shared asset bucket.
# Other builds load those files from other origins, and same-site would break
# every one of them.
#
# (This comment used to name those builds. The dist scan in tools/build.js
# caught it — netlify.toml is a published file, so it is held to exactly the
# same rules as the page, and it should be. The whole point of the minified
# build is that no visitor learns who else we work with by reading our files.)
[[headers]]
  for = "/*"
  [headers.values]
    # 29 Aug (pass246) — the EDGE lifetime, which is a different thing from the
    # browser lifetime below it. Netlify's own default for static content, set
    # explicitly because every HTML rule in this file overrides Cache-Control and
    # none of them said anything about the CDN. Deploys invalidate the cache for
    # the deploy context, so a year is not a staleness risk — it is the platform's
    # documented value. /assets/* already resolves to the same thing.
    Netlify-CDN-Cache-Control = "public, s-maxage=31536000, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Content-Security-Policy = "frame-ancestors 'self'"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
