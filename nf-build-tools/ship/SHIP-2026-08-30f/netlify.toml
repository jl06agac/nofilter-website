[build]
  publish = "."
  functions = "netlify/functions"

# 28 Aug: secrets scanning, told what not to look at.
#
# Netlify refuses to publish if it finds an environment variable's value in the
# files being deployed. Right idea, blunt instrument. It stopped two deploys:
#
#   1 - QUOTE_FROM and QUOTE_TO are email addresses that appear ON the page and
#       in the functions as defaults. They are meant to be public. They are
#       config, not credentials, and the scanner cannot tell the difference.
#       PRICE_BAG_1KG is a shop price. Same story.
#
#   2 - it then flagged lines that read `process.env.RESEND_API_KEY` and
#       `process.env.STRIPE_SECRET_KEY`. There is no key on those lines, only
#       the variable's NAME, and a name is how any code reads a variable at all.
#       No arrangement of this codebase removes them.
#
# So functions are excluded from the scan and three keys are named as non-secret.
# What this does NOT do is weaken the check where it earns its keep: index.html
# and every other published file are still scanned in full, and the real
# credentials - RESEND_API_KEY, STRIPE_SECRET_KEY, ACCESS_SECRET - are still
# checked against them. A function's source is executed on Netlify's servers and
# never sent to a browser, which is the whole thing secrets scanning exists to
# prevent.
#
# These live here rather than in the dashboard on purpose: they travel with the
# folder, so a deploy cannot fail because a variable was set on a different day.
[build.environment]
  SECRETS_SCAN_OMIT_PATHS = "netlify/functions/**"
  SECRETS_SCAN_OMIT_KEYS = "PRICE_BAG_1KG,QUOTE_FROM,QUOTE_TO"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ── 29 Aug (pass208) · the four route pages ──────────────────────────────────
# tools/build.js writes a real file per route — /shop/index.html and so on —
# each carrying its own title, description and hreflang. Netlify serves those at
# /shop, /origins, /office-coffee and /trade-pricing.
#
# They need naming here because the rule above matches the literal path
# "/index.html" and nothing else: /shop is served FROM /shop/index.html but is
# not requested as it, so it would fall through to the platform default. That
# default happens to be the same value, which is exactly why this is worth
# writing down — a page that must revalidate by accident is one platform change
# away from being cached for a year, and a cached route page is a visitor
# looking at last month's prices.
[[headers]]
  for = "/origins"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/shop"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/wholesale-coffee"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/trade-pricing"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ── 5 Sep · /faqs joins the named routes ─────────────────────────────────────
# Same reason as the four above: it is served FROM /faqs/index.html but is not
# requested as it, so without a rule of its own it falls through to the platform
# default. The answers change as the business does, so it must revalidate.
[[headers]]
  for = "/faqs"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ── 6 Sep · the /uk tree ─────────────────────────────────────────────────────
# The UK is a priced market in the build (GBP, its own ladder, the Dr.Coffee
# range) but had no URL until now: it was a state inside the page, reachable
# only by clicking the flag, so no page could be ranked, linked or crawled.
#
# Unlike /ae it needs no host rewrites — there is no .uk domain to redirect
# from, and that is deliberate: a .co.uk pointed at a market with no pages buys
# nothing, whereas these pages can rank on the domain that already does. What
# it does need is the same revalidation rule as every other named route, for
# the same reason: served FROM /uk/shop/index.html, never requested as it.
[[headers]]
  for = "/uk"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/uk/origins"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
