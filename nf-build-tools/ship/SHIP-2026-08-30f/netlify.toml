# The routes are called home/origins/shop/work/quote inside the app, and two of
# them are published under different names: work is /office-coffee because that
# is the phrase people search, and quote is /trade-pricing because that is what
# Alex calls it. /in-offices is the spelling he used when we first talked about
# real URLs.
#
# All three are things a person will type or a link will carry, and an unhandled
# one is a 404 on a page that exists. 301 rather than 200 on purpose: there is
# one URL per route, these are not it, and a permanent redirect says so to a
# crawler instead of quietly creating a second address for the same page.
