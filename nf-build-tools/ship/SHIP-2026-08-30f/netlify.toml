  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/uk/trade-pricing"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/uk/faqs"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/uk/origins/batang-toru"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/uk/origins/arakan-mountains"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
