# 29 Aug (pass214) — these two sit ahead of the catch-all below on purpose.
# /* matched /robots.txt as well, so a crawler asking this domain for its rules
# was handed 663KB of home page; the first fetcher to try it refused to go on.
# A crawler that cannot read robots.txt backs off, which is the opposite of what
# this migration is for. Netlify takes the first match, so order is the fix.
# 29 Aug (pass215) — 200, not 301: a rewrite, so the bytes of this site's
# robots.txt are SERVED at saucybean.co/robots.txt with no hop at all. The 301
# pass214 put here was correct by the spec and Googlebot would have followed it,
# but a second fetcher refused to follow a robots.txt redirect across hosts and
# therefore would not crawl the domain. robots.txt gates everything else on a
# domain whose only remaining job is to pass credit through, so it is worth
# removing the hop rather than relying on every client handling it well.
[[redirects]]
  from = "https://saucybean.co/robots.txt"
  to = "/robots.txt"
  status = 200
  force = true
[[redirects]]
  from = "https://www.saucybean.co/robots.txt"
  to = "/robots.txt"
  status = 200
  force = true
[[redirects]]
  from = "http://saucybean.co/robots.txt"
  to = "/robots.txt"
  status = 200
  force = true
[[redirects]]
  from = "http://www.saucybean.co/robots.txt"
  to = "/robots.txt"
  status = 200
  force = true
