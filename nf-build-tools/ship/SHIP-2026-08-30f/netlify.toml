# ── 29 Aug (pass220, extended pass225) · NAMED PATHS, NOT A WILDCARD ─────────
# pass218 wrote this as https://nofilter.ae/* -> /ae/:splat, and /* took
# everything with it: assets/fonts.css, favicon.ico, og-card.jpg, sitemap.xml,
# robots.txt, llms.txt and .netlify/functions/* all resolved into a tree that
# contains HTML pages and nothing else. The UAE domain would have rendered in a
# fallback typeface with a dead quote builder and a 404 sitemap.
#
# So every page is named: the five routes, and since pass225 the four origins.
# Everything else on nofilter.ae falls through to the shared root, which is
