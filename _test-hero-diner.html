<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NoFilter — hero · framed-window structure test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;900&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
/* ═══ structural test after the "bitesized" diner ref:
   framed window panel (nav + big headline + footage where the illustration sat)
   → wavy dark edge → centered statement + pill CTA → strip of work clips ═══ */
:root{--or:#ed3326;--cr:#F4F2EE;--nb:#1A1815;--straw:#ffe8c3;--gy:#8a8378;--ink2:#3D3E3D;
  --d:"Big Shoulders Display",sans-serif;--m:"IBM Plex Mono",monospace;--s:"Source Serif 4",Georgia,serif;}
*{box-sizing:border-box;} body{margin:0;background:var(--cr);color:var(--nb);font-family:var(--s);-webkit-font-smoothing:antialiased;}

/* ── the framed window panel ── */
.win{margin:clamp(10px,1.4vw,22px);border:4px solid var(--nb);background:
  linear-gradient(115deg,rgba(255,255,255,.35) 0%,rgba(255,255,255,0) 34%),var(--straw);
  overflow:hidden;position:relative;}
.nav{display:flex;align-items:center;justify-content:space-between;gap:18px;
  padding:clamp(14px,1.6vw,24px) clamp(18px,2.4vw,36px);}
.nav .links{display:flex;gap:clamp(14px,2vw,28px);}
.nav a{font-family:var(--m);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--nb);text-decoration:none;}
.nav .logo{font-family:var(--d);font-weight:900;font-size:26px;letter-spacing:.02em;color:var(--or);text-transform:uppercase;}
.win h1{font-family:var(--d);font-weight:900;text-transform:uppercase;text-align:center;color:var(--or);
  font-size:clamp(64px,10.5vw,190px);line-height:.84;letter-spacing:-.015em;margin:clamp(20px,3vw,48px) auto clamp(26px,3.5vw,56px);max-width:10ch;}
.win .film{position:relative;height:clamp(260px,44vh,480px);overflow:hidden;border-top:4px solid var(--nb);}
.win .film video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  filter:grayscale(.72) contrast(1.14) brightness(.9) sepia(.32) hue-rotate(165deg) saturate(1.05);}
.win .film .scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 1px,transparent 1px 3px);opacity:.4;mix-blend-mode:multiply;}
.win .film .cap{position:absolute;left:16px;bottom:14px;z-index:4;margin:0;font-family:var(--m);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  color:#e2e8ea;text-shadow:1.4px 0 rgba(237,51,38,.6),-1.4px 0 rgba(63,208,255,.5),0 1px 6px rgba(0,0,0,.7);}
.win .film .cap .n{color:var(--or);text-shadow:none;}

/* ── wavy dark edge out of the panel ── */
.wave{line-height:0;margin:0 clamp(10px,1.4vw,22px);}
.wave svg{display:block;width:100%;height:clamp(30px,4vw,58px);}
.wave path{fill:var(--nb);}

/* ── centered statement band ── */
.state{padding:clamp(64px,9vw,140px) clamp(24px,5vw,72px) clamp(40px,5vw,72px);text-align:center;}
.state h2{font-family:var(--d);font-weight:900;text-transform:uppercase;color:var(--nb);
  font-size:clamp(38px,5.2vw,92px);line-height:.92;letter-spacing:-.012em;margin:0 auto;max-width:22ch;}
.state h2 .o{color:var(--or);}
.state .cta{display:inline-block;margin-top:clamp(30px,4vw,52px);background:var(--or);color:var(--cr);
  font-family:var(--d);font-weight:900;text-transform:uppercase;letter-spacing:.04em;font-size:clamp(17px,1.5vw,22px);
  padding:16px 34px 14px;border-radius:999px;border:3px solid var(--nb);text-decoration:none;
  box-shadow:0 5px 0 var(--nb);}

/* ── work strip ── */
.strip{display:flex;gap:clamp(14px,1.8vw,26px);padding:clamp(40px,5vw,72px) clamp(24px,5vw,72px) clamp(70px,8vw,120px);
  justify-content:center;flex-wrap:nowrap;overflow:hidden;}
.strip .tile{flex:0 0 clamp(200px,23vw,340px);aspect-ratio:16/10;overflow:hidden;border-radius:10px;position:relative;
  background:#0c0c0b;border:3px solid var(--nb);box-shadow:0 6px 0 var(--nb);}
.strip .tile video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.strip .tile.coldt video{filter:grayscale(.72) contrast(1.14) brightness(.9) sepia(.32) hue-rotate(165deg) saturate(1.05);}

@media(max-width:760px){
  .nav .links{display:none;}
  .strip{flex-wrap:wrap;}
}
</style>
</head>
<body>

<div class="win">
  <nav class="nav">
    <span class="links"><a href="#">The Line</a><a href="#">Origins</a><a href="#">Shop</a></span>
    <span class="logo">NoFilter</span>
    <span class="links"><a href="#">At Work</a><a href="#">Build a Quote</a></span>
  </nav>
  <h1>Hold the line.</h1>
  <div class="film">
    <video src="mega-farm-test.mp4" muted loop playsinline autoplay preload="auto"></video>
    <span class="scan" aria-hidden="true"></span>
    <p class="cap"><span class="n">Fig. 01</span> &middot; Grown where it's cheapest</p>
  </div>
</div>

<div class="wave" aria-hidden="true"><svg viewBox="0 0 1440 60" preserveAspectRatio="none"><path d="M0,0 L1440,0 L1440,26 C1380,50 1320,50 1260,26 C1200,2 1140,2 1080,26 C1020,50 960,50 900,26 C840,2 780,2 720,26 C660,50 600,50 540,26 C480,2 420,2 360,26 C300,50 240,50 180,26 C120,2 60,2 0,26 Z"/></svg></div>

<section class="state">
  <h2>The truth is most of the coffee we drink comes from vast <span class="o">mega&#8209;farms&hellip;</span></h2>
  <a class="cta" href="#">See where the line is drawn</a>
</section>

<div class="strip">
  <div class="tile coldt"><video src="mono-coffee-long.mp4" muted loop playsinline autoplay preload="auto"></video></div>
  <div class="tile coldt"><video src="clears-forest.mp4" muted loop playsinline autoplay preload="auto"></video></div>
  <div class="tile"><video src="keeps-standing.mp4" muted loop playsinline autoplay preload="auto"></video></div>
  <div class="tile"><video src="atwork-forest-loop.mp4" muted loop playsinline autoplay preload="auto"></video></div>
</div>

<script>
(function(){
  document.querySelectorAll('video').forEach(function(v){ var p=v.play&&v.play(); if(p&&p.catch)p.catch(function(){}); });
})();
</script>
</body>
</html>
