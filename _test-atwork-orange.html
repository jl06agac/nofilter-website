<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEST — At Work · orange strobe band + flip counter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;900&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{--or:#ed3326;--cr:#F4F2EE;--nb:#1A1815;
  --fd:"Big Shoulders Display",sans-serif;--fb:"Archivo",sans-serif;--fm:"IBM Plex Mono",monospace;--fs:"Source Serif 4",Georgia,serif;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0e0d0c;font-family:var(--fb);}
/* ─────────── the band ─────────── */
.aw{position:relative;color:#fff;overflow:hidden;background:#7a1a10;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:clamp(60px,10vh,120px) clamp(20px,5vw,40px);}
/* forest footage sits behind everything; the orange field covers it, and strobes to reveal it on cuts */
/* footage sits at the BACK; the red field covers it and blinks quick glimpses through; text stays on top */
.aw-flashwrap{position:absolute;inset:0;z-index:0;pointer-events:none;background:#000;}
.aw-flashwrap .fv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;}
.aw-flashwrap .fv.on{opacity:1;}
.aw-field{position:absolute;inset:0;background:var(--or);z-index:1;}
.aw-field.glimpse{animation:glimpse .62s steps(1,end);}   /* quick red→footage→red blinks (footage held long enough to read) */
@keyframes glimpse{0%{opacity:1}15%{opacity:0}33%{opacity:1}50%{opacity:0}68%{opacity:1}100%{opacity:1}}
/* faint moving grain/scanline texture so the field feels alive, not flat */
.aw-field::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.06;mix-blend-mode:overlay;
  background:repeating-linear-gradient(0deg,#000 0 1px,transparent 1px 3px);animation:scan 7s linear infinite;}
@keyframes scan{to{transform:translateY(3px);}}
.aw>.aw-eyebrow,.aw>.aw-stage,.aw>.aw-counter{position:relative;z-index:2;}
/* accessibility: never strobe under reduced-motion — hold solid red, gentle fades only */
@media(prefers-reduced-motion:reduce){
  .aw-field.glimpse{animation:none;}
  .aw-head.out-a,.aw-head.in-a,.aw-head.out-b,.aw-head.in-b{animation:none;transition:opacity .4s ease;}
}
.aw-eyebrow{font-family:var(--fm);font-size:clamp(11px,1.1vw,13px);letter-spacing:.32em;text-transform:uppercase;
  color:rgba(255,255,255,.82);margin-bottom:clamp(22px,3vw,34px);}
/* ─────────── kinetic headline ─────────── */
.aw-stage{min-height:2.4em;display:flex;align-items:center;justify-content:center;width:100%;}
.aw-head{font-family:var(--fd);font-weight:900;text-transform:uppercase;letter-spacing:-.015em;
  line-height:.9;font-size:clamp(32px,7vw,90px);color:#fff;max-width:none;}
.aw-head .w{display:inline-block;will-change:transform,opacity,filter;}
.aw-head .ln{display:block;white-space:nowrap;}   /* each written line stays one line — no re-wrap */
/* style A — hard strobe cut: line flickers on/off then snaps */
@keyframes strobeOut{0%{opacity:1}18%{opacity:.15}34%{opacity:.9}52%{opacity:0}100%{opacity:0}}
@keyframes strobeIn{0%{opacity:0;filter:blur(6px)}12%{opacity:.9;filter:blur(0)}22%{opacity:.15}40%{opacity:1}62%{opacity:.35}100%{opacity:1;filter:blur(0)}}
.aw-head.out-a{animation:strobeOut .26s steps(1,end) forwards;}
.aw-head.in-a{animation:strobeIn .42s steps(1,end) forwards;}
/* style B — word stagger: each word snaps up with a flash, staggered */
@keyframes wordIn{0%{opacity:0;transform:translateY(.5em) scaleY(1.15);filter:blur(4px)}
  40%{opacity:1;filter:blur(0)}55%{opacity:.2}70%{opacity:1}100%{opacity:1;transform:none;filter:blur(0)}}
@keyframes wordOut{0%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-.32em)}}
.aw-head.in-b .w{opacity:0;animation:wordIn .5s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:var(--d,0ms);}
.aw-head.out-b .w{animation:wordOut .2s ease forwards;animation-delay:var(--d,0ms);}
/* ─────────── flip / tick counter ─────────── */
.aw-counter{margin-top:clamp(40px,6vh,72px);display:flex;flex-direction:column;align-items:center;gap:14px;}
.aw-counter-lab{font-family:var(--fm);font-size:clamp(10px,1vw,12px);letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.8);}
.odo{display:flex;align-items:stretch;gap:5px;}
.odo .cell,.odo .sep{position:relative;}
.odo .cell{width:clamp(38px,5.4vw,74px);height:clamp(56px,8vw,108px);border-radius:9px;overflow:hidden;
  background:#161311;box-shadow:0 10px 30px -10px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.05);}
/* the horizontal split line that reads as a flip board */
.odo .cell::after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;transform:translateY(-1px);
  background:rgba(0,0,0,.55);z-index:3;}
.odo .strip{position:absolute;left:0;right:0;top:0;display:flex;flex-direction:column;
  transition:transform .5s cubic-bezier(.3,1.1,.35,1);}
.odo .strip span{height:clamp(56px,8vw,108px);display:flex;align-items:center;justify-content:center;
  font-family:var(--fd);font-weight:900;font-size:clamp(34px,5vw,68px);color:#fff;line-height:1;}
.odo .sep{width:clamp(10px,1.4vw,20px);display:flex;align-items:flex-end;justify-content:center;
  font-family:var(--fd);font-weight:900;font-size:clamp(30px,4.4vw,60px);color:rgba(255,255,255,.9);padding-bottom:.28em;}
.aw-counter-unit{font-family:var(--fd);font-weight:900;text-transform:uppercase;letter-spacing:.01em;
  font-size:clamp(18px,2.2vw,30px);color:#fff;margin-top:4px;}
.aw-counter-unit small{font-family:var(--fs);font-style:italic;font-weight:400;text-transform:none;letter-spacing:0;
  font-size:.62em;color:rgba(255,255,255,.85);margin-left:8px;}
/* controls */
.ctl{position:fixed;top:14px;right:14px;z-index:20;display:flex;gap:6px;background:rgba(0,0,0,.25);
  border:1px solid rgba(255,255,255,.25);border-radius:99px;padding:5px;}
.ctl button{font-family:var(--fm);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:#fff;
  background:transparent;border:none;border-radius:99px;padding:7px 13px;cursor:pointer;transition:.15s;}
.ctl button.on{background:#fff;color:var(--or);}
.note{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:20;font-family:var(--fm);
  font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.75);}
</style>
</head>
<body>
<div class="ctl"><button data-bg="solid" class="on">Solid red</button><button data-bg="video">Red ⇄ video</button></div>

<section class="aw">
  <div class="aw-field"></div>
  <p class="aw-eyebrow">At work · the impact you can point to</p>
  <div class="aw-stage"><h2 class="aw-head" id="head"></h2></div>

  <div class="aw-counter">
    <span class="aw-counter-lab">Forest kept standing across NoFilter workplaces</span>
    <div class="odo" id="odo" aria-label="impact counter"></div>
    <p class="aw-counter-unit">m² of rainforest <small>— and counting</small></p>
  </div>

  <!-- full-screen flash layer: whole screen cuts to footage on each strobe, then gone.
       Rotates through the origin clips; drop espresso/latte-pour clips into this list to mix coffee scenes in. -->
  <div class="aw-flashwrap" id="flashwrap">
    <!-- near-static forest: stillest 4s of Gayo Lues, boomerang-looped so there's no jump -->
    <video class="fv on" src="atwork-forest-loop.mp4" poster="atwork-forest-poster.jpg" muted loop playsinline autoplay preload="auto"></video>
  </div>
</section>
<p class="note">prototype · two headline styles (toggle top-right) · counter ticks live</p>

<script>
/* ───── kinetic headline ───── */
var MESSAGES = [
  ['Every coffee at work,','holding the line.'],
  ['All those office cups,','measured in forest.'],
  ["A team's coffee break,",'protecting a rainforest.'],
  ['A habit at work.','A forest left standing.']
];
var head=document.getElementById('head'), flashwrap=document.getElementById('flashwrap'),
    fvs=[].slice.call(document.querySelectorAll('.fv')), fvi=0, mi=0, style='a', bgMode='solid';
function render(lines){
  head.innerHTML = lines.map(function(ln){
    var words=ln.split(' ').map(function(w){return '<span class="w">'+w+'</span>';}).join(' ');
    return '<span class="ln">'+words+'</span>';
  }).join('');
  // per-word stagger delays for style B
  var ws=head.querySelectorAll('.w');
  ws.forEach(function(w,i){ w.style.setProperty('--d',(i*70)+'ms'); });
}
function show(lines){
  render(lines);
  head.classList.remove('out-a','out-b','in-a','in-b');
  void head.offsetWidth;
  head.classList.add(style==='a'?'in-a':'in-b');
}
function cycle(){                                    // text cycles independently — it stays put during glimpses
  var next=(mi+1)%MESSAGES.length;
  head.classList.remove('in-a','in-b');
  head.classList.add(style==='a'?'out-a':'out-b');
  var wait = style==='a' ? 240 : 220;
  setTimeout(function(){ mi=next; show(MESSAGES[mi]); }, wait);
}
show(MESSAGES[0]);
var cycT=setInterval(cycle, 3200);

/* background glimpses: red field blinks a quick glimpse of footage (behind the text), then back to red.
   Runs on its own rhythm so the message stays legible; rotates the clip each time. */
var field=document.querySelector('.aw-field');
function glimpse(){
  if(bgMode!=='video' || !field) return;
  fvi=(fvi+1)%fvs.length;
  fvs.forEach(function(v,k){ v.classList.toggle('on',k===fvi); });
  field.classList.remove('glimpse'); void field.offsetWidth; field.classList.add('glimpse');
}
function scheduleGlimpse(){ setTimeout(function(){ glimpse(); scheduleGlimpse(); }, 5000 + Math.random()*2500); }  // ~5–7.5s apart, irregular
scheduleGlimpse();
function playAll(){ fvs.forEach(function(v){ var p=v.play&&v.play(); if(p&&p.catch)p.catch(function(){}); }); }
window.addEventListener('load', playAll);

document.querySelectorAll('.ctl button').forEach(function(b){
  b.addEventListener('click',function(){
    document.querySelectorAll('.ctl button').forEach(function(x){x.classList.remove('on');});
    b.classList.add('on'); bgMode=b.getAttribute('data-bg');   // 'solid' | 'video'
    if(bgMode==='video'){ playAll(); glimpse(); }               // click is a user gesture → clips allowed to play; fire one immediately
  });
});

/* ───── flip / tick odometer (rolling digits, flip-board styling) ───── */
var DIGITS=7, TARGET=248910;                 // demo target
var odo=document.getElementById('odo'), strips=[];
(function buildOdo(){
  // group with comma separators every 3 from the right
  var cellSlots=[];
  for(var i=0;i<DIGITS;i++){
    var posFromRight=DIGITS-i;
    var cell=document.createElement('div'); cell.className='cell';
    var strip=document.createElement('div'); strip.className='strip';
    var html=''; for(var d=0;d<=9;d++) html+='<span>'+d+'</span>'; html+='<span>0</span>';
    strip.innerHTML=html; cell.appendChild(strip); odo.appendChild(cell); strips.push(strip);
    if(posFromRight>1 && (posFromRight-1)%3===0){ var sep=document.createElement('div'); sep.className='sep'; sep.textContent=','; odo.appendChild(sep); }
  }
})();
var cellH=0;
function measure(){ cellH=strips[0].parentElement.getBoundingClientRect().height; }
function setValue(n){
  if(!cellH) measure();
  var s=String(Math.max(0,Math.floor(n))).padStart(DIGITS,'0');
  for(var i=0;i<DIGITS;i++){ var d=+s[i]; strips[i].style.transform='translateY(-'+(d*cellH)+'px)'; }
}
function easeOutCubic(t){ return 1-Math.pow(1-t,3); }
function countTo(target,dur){
  var start=performance.now();
  (function step(now){
    var p=Math.min(1,(now-start)/dur), v=Math.round(easeOutCubic(p)*target);
    setValue(v);
    if(p<1) requestAnimationFrame(step);
    else liveTick(target);
  })(start);
}
function liveTick(from){          // keep it feeling live: small increments forever
  var v=from;
  setInterval(function(){ v += Math.floor(Math.random()*6)+1; setValue(v); }, 1400);
}
window.addEventListener('load',function(){ measure(); setValue(0); setTimeout(function(){ countTo(TARGET,2600); }, 500); });
window.addEventListener('resize',function(){ measure(); });
</script>
</body>
</html>
