<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NoFilter — Unified site preview</title>
<style>
  :root{ --ink:#1A1815; --cream:#F4F2EE; --red:#ed3326; --mono:"IBM Plex Mono",ui-monospace,monospace; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; background:#0d0c0b; }
  .up-bar{ position:sticky; top:0; z-index:50; display:flex; align-items:center; gap:14px;
    background:#0d0c0b; color:var(--cream); border-bottom:1px solid rgba(244,242,238,.14);
    padding:10px 18px; font-family:var(--mono); font-size:11px; letter-spacing:.16em; text-transform:uppercase; }
  .up-bar b{ color:var(--red); }
  .up-bar .up-links{ display:flex; gap:4px; flex-wrap:wrap; margin-left:auto; }
  .up-bar a{ color:var(--cream); text-decoration:none; opacity:.65; padding:4px 8px; border:1px solid rgba(244,242,238,.16); border-radius:3px; }
  .up-bar a:hover{ opacity:1; border-color:var(--red); color:var(--red); }
  .up-seg{ position:relative; }
  .up-tab{ position:sticky; top:39px; z-index:40; display:flex; align-items:center; gap:12px;
    background:var(--red); color:#fff; padding:8px 18px; font-family:var(--mono); font-size:11px;
    letter-spacing:.22em; text-transform:uppercase; }
  .up-tab span{ opacity:.75; }
  iframe{ display:block; width:100%; border:0; background:#F4F2EE; height:100vh; }
</style>
</head>
<body>
  <div class="up-bar">
    NoFilter — <b>unified preview</b> · one file, whole revised site
    <span class="up-links">
      <a href="#home">Home</a><a href="#origins">Origins</a><a href="#shop">Shop</a><a href="#machines">Machines</a><a href="#atwork">At Work</a>
    </span>
  </div>

  <div class="up-seg" id="home">
    <div class="up-tab">Home <span>· index.PREVIEW-htl-glitch.html</span></div>
    <iframe data-fit src="index.PREVIEW-htl-glitch.html" title="Home"></iframe>
  </div>
  <div class="up-seg" id="origins">
    <div class="up-tab">Origins <span>· origins.PREVIEW.html</span></div>
    <iframe data-fit src="origins.PREVIEW.html" title="Origins"></iframe>
  </div>
  <div class="up-seg" id="shop">
    <div class="up-tab">Shop <span>· shop.PREVIEW.html</span></div>
    <iframe data-fit src="shop.PREVIEW.html" title="Shop"></iframe>
  </div>
  <div class="up-seg" id="machines">
    <div class="up-tab">Machines <span>· machines.PREVIEW.html</span></div>
    <iframe data-fit src="machines.PREVIEW.html" title="Machines"></iframe>
  </div>
  <div class="up-seg" id="atwork">
    <div class="up-tab">At Work <span>· workplace.PREVIEW.html</span></div>
    <iframe data-fit src="workplace.PREVIEW.html" title="At Work"></iframe>
  </div>

  <script>
  /* Same-origin (all served from localhost:8000), so we can size each iframe to its
     content height — the whole site reads as one continuous scroll, no nested scrollbars. */
  function fit(f){
    try{
      var d = f.contentDocument || f.contentWindow.document;
      var h = Math.max(d.documentElement.scrollHeight, d.body ? d.body.scrollHeight : 0);
      if(h > 0) f.style.height = h + 'px';
    }catch(e){ /* cross-origin or not ready — leave at 100vh */ }
  }
  document.querySelectorAll('iframe[data-fit]').forEach(function(f){
    f.addEventListener('load', function(){
      fit(f);
      [600,1500,3000,6000].forEach(function(t){ setTimeout(function(){ fit(f); }, t); });
    });
  });
  window.addEventListener('resize', function(){
    document.querySelectorAll('iframe[data-fit]').forEach(fit);
  });
  </script>
</body>
</html>
