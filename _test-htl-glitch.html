<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEST — Hold the Line · glitch-battle intro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;900&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{
  --or:#ed3326; --cr:#F4F2EE; --nb:#0d0c0b; --gy:#8a8378;
  --font-d:"Big Shoulders Display",sans-serif;
  --font-m:"IBM Plex Mono",monospace;
  --font-s:"Source Serif 4",Georgia,serif;
  --mega:1;              /* how present the mega-farm layer is (1 dominant -> ~.14 residual) */
}
*{box-sizing:border-box;} html,body{margin:0;background:#000;color:var(--cr);font-family:var(--font-m);}
.stage{position:relative;width:100%;height:100vh;overflow:hidden;background:#000;}

/* ——— the two combatants, both full-bleed ——— */
.v{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;}
.v-agro{filter:saturate(1.02) contrast(1.02);}            /* NoFilter — the standing edge (base layer) */
.v-mega{opacity:var(--mega);filter:grayscale(.25) contrast(1.08) brightness(.96);}  /* the mega-farm, on top */

/* scanline + vignette wash over everything */
.stage::after{content:"";position:absolute;inset:0;z-index:6;pointer-events:none;
  background:
    repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px),
    radial-gradient(120% 90% at 50% 40%,transparent 55%,rgba(0,0,0,.55));
  mix-blend-mode:multiply;opacity:.5;}

/* ——— GLITCH: torn horizontal bands + rgb tear on the mega layer while the two battle ——— */
.stage.glitch .v-mega{animation:megaTear .5s steps(3) infinite;}
@keyframes megaTear{
  0%  {clip-path:inset(0 0 88% 0);   transform:translate(-1%,0);}
  25% {clip-path:inset(42% 0 44% 0); transform:translate(1.4%,0);}
  50% {clip-path:inset(70% 0 16% 0); transform:translate(-1.4%,0);}
  75% {clip-path:inset(18% 0 66% 0); transform:translate(1%,0);}
  100%{clip-path:inset(0 0 0 0);     transform:translate(0,0);}
}
/* rgb-split ghosts of the mega layer (only shown during glitch) */
.rgb-r,.rgb-b{position:absolute;inset:0;z-index:3;opacity:0;pointer-events:none;mix-blend-mode:screen;transition:opacity .1s;}
.rgb-r{background:var(--or);mix-blend-mode:multiply;}
.stage.glitch .rgb-r{opacity:.09;transform:translateX(4px);}
.stage.glitch .rgb-b{opacity:.08;background:#3fd0ff;transform:translateX(-4px);}

/* a hard white flash frame on the biggest hits */
.flash{position:absolute;inset:0;z-index:7;background:#fff;opacity:0;pointer-events:none;}
.flash.on{animation:flash .12s ease;}
@keyframes flash{from{opacity:.5;}to{opacity:0;}}

/* ——— headline: HOLD THE LINE, word by word ——— */
.wrap{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 6vw;}
.eyebrow{font-family:var(--font-m);font-size:clamp(10px,1vw,12px);letter-spacing:.28em;text-transform:uppercase;color:var(--or);opacity:0;transition:opacity .6s ease;margin-bottom:clamp(14px,2vw,26px);}
.eyebrow.in{opacity:.9;}
.htl{font-family:var(--font-d);font-weight:900;text-transform:uppercase;line-height:.86;letter-spacing:-.01em;
  font-size:clamp(56px,13vw,190px);display:flex;gap:.28em;flex-wrap:wrap;justify-content:center;}
.htl .w{display:inline-block;opacity:0;transform:translateY(-.5em);filter:blur(6px);}
.htl .w.drop{animation:wordDrop .5s cubic-bezier(.2,.9,.2,1) forwards;}
@keyframes wordDrop{
  0%  {opacity:0;transform:translateY(-.5em) scale(1.04);filter:blur(6px);}
  55% {opacity:1;transform:translateY(.06em);filter:blur(0);}
  62% {transform:translateY(.06em) translateX(-6px);}      /* glitch snap on landing */
  66% {transform:translateY(.06em) translateX(5px);}
  70% {transform:translateY(0) translateX(0);}
  100%{opacity:1;transform:translateY(0);filter:blur(0);}
}
/* residual rgb-split on the landed headline while things are still unstable */
.htl.jitter .w{text-shadow:3px 0 rgba(237,51,38,.7),-3px 0 rgba(63,208,255,.6);}
.htl.settled .w{text-shadow:none;transition:text-shadow .5s ease;}

/* ——— the truth copy — ties message to shot ——— */
.truth{position:absolute;left:0;right:0;bottom:clamp(30px,6vh,70px);z-index:8;
  padding:0 8vw;text-align:center;opacity:0;transform:translateY(14px);transition:opacity .9s ease,transform .9s ease;}
.truth.in{opacity:1;transform:none;}
.truth p{font-family:var(--font-s);font-size:clamp(15px,1.7vw,21px);line-height:1.5;max-width:60ch;margin:0 auto;color:#e9e5dc;}
.truth .o{color:var(--or);font-style:italic;}

/* controls (test only) */
.ctl{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;gap:16px;align-items:center;justify-content:center;
  padding:9px;background:rgba(6,5,4,.92);color:#fff;font-family:var(--font-m);font-size:11px;letter-spacing:.05em;}
.ctl button{font-family:var(--font-m);font-size:11px;letter-spacing:.08em;text-transform:uppercase;background:var(--or);color:#fff;border:none;border-radius:7px;padding:8px 16px;cursor:pointer;}
.ctl .hint{opacity:.5;}
@media(prefers-reduced-motion:reduce){.htl .w{opacity:1;transform:none;filter:none;} .stage.glitch .v-mega{animation:none;}}
</style>
</head>
<body>

<section class="stage" id="stage">
  <!-- base layer: NoFilter's current hero video (the standing edge). -->
  <video class="v v-agro" id="vAgro" src="hero-trim.mp4" muted loop playsinline autoplay preload="auto"></video>
  <!-- top layer: the mega-farm (placeholder = monoculture drone; swap to Brazil footage). -->
  <video class="v v-mega" id="vMega" src="mega-farm-test.mp4" muted loop playsinline autoplay preload="auto"></video>
  <div class="rgb-r"></div><div class="rgb-b"></div>
  <div class="flash" id="flash"></div>

  <div class="wrap">
    <div class="eyebrow" id="eyebrow" contenteditable="true" spellcheck="false">NoFilter</div>
    <h1 class="htl" id="htl" aria-label="Hold the line.">
      <span class="w">Hold</span><span class="w">the</span><span class="w">line.</span>
    </h1>
  </div>

  <div class="truth" id="truth">
    <p contenteditable="true" spellcheck="false">The truth is most of the coffee we drink comes from <span class="o">mega farms</span> &mdash; land as far as the eye can track, ruthlessly efficient, mechanised and maximised for profit.</p>
  </div>
</section>

<div class="ctl">
  <span class="hint">TEST · mega-farm footage is a placeholder (mono-coffee-long) · text is editable ·</span>
  <button id="replay" type="button">Replay sequence</button>
</div>

<script>
(function(){
  var stage=document.getElementById('stage');
  var htl=document.getElementById('htl');
  var words=[].slice.call(htl.querySelectorAll('.w'));
  var eyebrow=document.getElementById('eyebrow');
  var truth=document.getElementById('truth');
  var flash=document.getElementById('flash');
  var root=document.documentElement;
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  var timers=[], residual=null;

  function T(fn,ms){ timers.push(setTimeout(fn,ms)); }
  function clearAll(){ timers.forEach(clearTimeout); timers=[]; if(residual){clearInterval(residual);residual=null;} }
  function setMega(v){ root.style.setProperty('--mega', v); }

  // a short glitch — only at the cut between the two production types
  function glitchFor(dur,doFlash){
    stage.classList.add('glitch');
    if(doFlash){ flash.classList.remove('on'); void flash.offsetWidth; flash.classList.add('on'); }
    T(function(){ stage.classList.remove('glitch'); }, dur);
  }
  // ease --mega from a->b over dur (the clean cut from one shot to the other)
  function ramp(a,b,dur){
    var t0=null;
    function step(ts){ if(t0===null)t0=ts; var p=Math.min((ts-t0)/dur,1); var e=1-Math.pow(1-p,3);
      setMega((a+(b-a)*e).toFixed(3)); if(p<1) requestAnimationFrame(step); }
    requestAnimationFrame(step);
  }
  // one transition: brief glitch, clean cut, then HOLD on the new shot
  function cut(from,to,flash){ glitchFor(380,flash); ramp(from,to,440); }

  function play(){
    clearAll();
    words.forEach(function(w){ w.classList.remove('drop'); });
    htl.classList.remove('settled'); htl.classList.add('jitter');
    eyebrow.classList.remove('in'); truth.classList.remove('in');
    setMega('1'); void htl.offsetWidth;
    [document.getElementById('vAgro'),document.getElementById('vMega')].forEach(function(v){ var p=v.play&&v.play(); if(p&&p.catch)p.catch(function(){}); });

    if(reduce){ words.forEach(function(w){w.style.opacity=1;}); eyebrow.classList.add('in'); truth.classList.add('in'); setMega('0'); return; }

    T(function(){ eyebrow.classList.add('in'); }, 400);

    // HOLD 1 — the mega-farm, clean, long enough to read it (~2.1s)
    // → cut to the hero, word "Hold"
    T(function(){ cut(1,0,true); words[0].classList.add('drop'); }, 2100);
    // HOLD 2 — the hero / standing edge, clean (~2.1s)
    // → cut back to the mega-farm, word "the"
    T(function(){ cut(0,1,true); words[1].classList.add('drop'); }, 4200);
    // HOLD 3 — the mega-farm again (~2.1s)
    // → cut to the hero for good, word "line."
    T(function(){ glitchFor(460,true); ramp(1,0,560); words[2].classList.add('drop'); }, 6300);

    T(function(){ truth.classList.add('in'); }, 6900);
    T(function(){ htl.classList.remove('jitter'); htl.classList.add('settled'); }, 7400);

    // FINAL — pure agroforest/hero (--mega:0, no overlay). Only rare, brief flickers of the mega
    // trying to break back in, then straight back to clean hero.
    T(function(){
      residual=setInterval(function(){
        if(Math.random()<0.5){
          glitchFor(150, Math.random()<0.2);
          setMega('0.5');
          setTimeout(function(){ setMega('0'); }, 150);
        }
      }, 3400);
    }, 8200);
  }

  document.getElementById('replay').addEventListener('click',play);
  if(document.fonts&&document.fonts.ready){ document.fonts.ready.then(play); } else { play(); }
})();
</script>
</body>
</html>
