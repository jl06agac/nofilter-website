<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NoFilter — scroll word-fill · single statement</title>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;900&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{--or:#ed3326;--cr:#F4F2EE;--nb:#1A1815;--gy:#8a8378;--ink2:#3D3E3D;
  --d:"Big Shoulders Display",sans-serif;--m:"IBM Plex Mono",monospace;--s:"Source Serif 4",Georgia,serif;}
*{box-sizing:border-box;} body{margin:0;background:var(--cr);color:var(--nb);font-family:var(--s);-webkit-font-smoothing:antialiased;}
.intro{max-width:1040px;margin:0 auto;padding:clamp(80px,12vh,150px) 24px clamp(20px,3vh,40px);text-align:center;}
.kick{display:inline-flex;align-items:center;gap:14px;font-family:var(--m);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--or);margin:0;}

/* pinned single-statement fill */
.fillsec{position:relative;height:200vh;}
.fillpin{position:sticky;top:0;height:100vh;display:grid;place-items:center;}
.filltext{max-width:1000px;margin:0 auto;padding:0 clamp(24px,5vw,72px);
  font-family:var(--s);font-weight:500;font-size:clamp(30px,4vw,60px);line-height:1.24;letter-spacing:-.01em;text-align:left;}
.filltext .w{color:var(--nb);}
.filltext .w.turn{font-weight:600;}

/* the evidence, below the claim */
.evidence{max-width:1040px;margin:0 auto;padding:0 24px clamp(80px,10vh,140px);}
.film{position:relative;overflow:hidden;background:#0c0c0b;aspect-ratio:16/9;box-shadow:0 34px 90px -52px rgba(26,24,21,.55);}
.film video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(.72) contrast(1.14) brightness(.9) sepia(.32) hue-rotate(165deg) saturate(1.05);}
.film .scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 1px,transparent 1px 3px);opacity:.4;mix-blend-mode:multiply;}
.credits{position:absolute;left:0;right:0;bottom:12px;z-index:4;display:flex;justify-content:center;gap:clamp(22px,4vw,60px);flex-wrap:wrap;font-family:var(--m);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:rgba(244,242,238,.55);text-align:center;text-shadow:0 1px 6px rgba(0,0,0,.65);}
.credits b{display:block;color:#F4F2EE;font-weight:500;margin-top:3px;}
</style>
</head>
<body>
<section class="intro"><span class="kick">What most coffee does</span></section>

<section class="fillsec" id="fillsec">
  <div class="fillpin">
    <p class="filltext" id="filltext" data-turnfrom="34">Most coffee comes from vast mega-farms — grown where it’s cheapest, engineered for the lowest possible cost. What they squeeze out is the forested land where coffee still grows under canopy — land that only stays standing while the coffee finds a buyer.</p>
  </div>
</section>

<section class="evidence">
  <figure class="film">
    <video src="mono-coffee-long.mp4" muted loop playsinline autoplay preload="auto"></video>
    <span class="scan" aria-hidden="true"></span>
    <div class="credits">
      <span>Grown<b>where it's cheapest</b></span>
      <span>Field note<b>01 &middot; on the cost of cheap</b></span>
      <span>Filed by<b>NoFilter</b></span>
    </div>
  </figure>
</section>

<script>
(function(){
  document.querySelectorAll('video').forEach(function(v){ var p=v.play&&v.play(); if(p&&p.catch)p.catch(function(){}); });
  var el=document.getElementById('filltext'), sec=document.getElementById('fillsec');
  var base=0.16, turnFrom=parseInt(el.getAttribute('data-turnfrom'),10)||9999;
  var words=el.textContent.trim().split(/\s+/); el.textContent='';
  var spans=words.map(function(w,i){ var s=document.createElement('span'); s.className='w'+(i>=turnFrom?' turn':''); s.textContent=w; s.style.opacity=base; el.appendChild(s); el.appendChild(document.createTextNode(' ')); return s; });
  var N=spans.length, raf=null;
  function upd(){
    var r=sec.getBoundingClientRect(), total=r.height-window.innerHeight;
    var prog=Math.min(1,Math.max(0,(-r.top)/total));
    var front=prog*(N+6)-3;
    for(var i=0;i<N;i++){ var t=Math.max(0,Math.min(1,front-i)); spans[i].style.opacity=(base+(1-base)*t).toFixed(3); }
    raf=null;
  }
  function onScroll(){ if(!raf) raf=requestAnimationFrame(upd); }
  window.addEventListener('scroll',onScroll,{passive:true});
  window.addEventListener('resize',onScroll); upd();
})();
</script>
</body>
</html>
