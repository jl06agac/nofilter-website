<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEST — private reveal (impact counter + what runs behind the scenes)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;900&family=Archivo:wght@0,400;0,500;0,600;0,700&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;1,8..60,400&display=swap" rel="stylesheet">
<style>
/* tokens (from _partials/site-head.html) */
:root{
  --or:#ed3326; --cr:#F4F2EE; --pa:#EDE7D9; --nb:#1A1815; --li:#D8D4CE; --gy:#6B6B6B;
  --font-display:"Big Shoulders Display",sans-serif;
  --font-bs:"Big Shoulders Display",sans-serif;
  --font-b:"Archivo","Helvetica Neue",Arial,sans-serif;
  --font-m:"IBM Plex Mono","SF Mono",monospace;
  --font-s:"Source Serif 4",Georgia,serif;
  --tk-label:0.14em;
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--font-b);background:var(--cr);color:var(--nb);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
.wrap{max-width:1200px;margin:0 auto;padding:0 28px;}
.eyebrow{font-family:var(--font-m);font-size:11px;letter-spacing:var(--tk-label);text-transform:uppercase;color:var(--or);font-weight:500;margin-bottom:18px;}
.sec-title{font-family:var(--font-display);font-weight:900;text-transform:uppercase;line-height:.94;letter-spacing:-.02em;margin:0 0 22px;}

/* ═══ TABLET COUNTER tile CSS — harvested verbatim from the Part 2 master (.vt-counter/.vt-tablet 916–923).
   The iframe loads the live split-flap board (nofilter-counter.html), which carries the named greeting. ═══ */
.vt-counter{--bezel:#15171a;}
.vt-counter .vt-counter-frame{position:relative;width:100%;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;background:transparent;border:0;}
.vt-tablet{position:relative;width:100%;height:100%;background:linear-gradient(155deg,#3a3d42 0%,#1c1e22 38%,#16181b 100%);border-radius:30px;padding:5.5% 4.6%;box-shadow:0 18px 44px rgba(0,0,0,.45),0 2px 0 rgba(255,255,255,.05),inset 0 0 0 2px rgba(255,255,255,.06),inset 0 2px 3px rgba(255,255,255,.10);box-sizing:border-box;}
.vt-tablet::before{content:"";position:absolute;top:2.6%;left:50%;width:7px;height:7px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#3b4a5a,#0a0d10 70%);transform:translateX(-50%);box-shadow:0 0 0 1px rgba(0,0,0,.5);}
.vt-tablet-screen{position:relative;width:100%;height:100%;border-radius:6px;overflow:hidden;background:#0b0c0e;box-shadow:inset 0 0 0 2px #000, 0 0 0 3px #2a2d31, 0 0 14px rgba(0,0,0,.55) inset;}
.vt-tablet-screen iframe{position:absolute;top:50%;left:50%;width:1024px;height:768px;border:0;transform:translate(-50%,-50%) scale(var(--scl,.36));transform-origin:center center;pointer-events:auto;}

/* ═══ WHAT RUNS BEHIND THE SCENES — vtile grid + servicing tile, harvested verbatim from the Part 2 master
   (vstack-grid 810, vtile 822–846, vt-svc 859–881, vt-map 906–921, figcaption 923–933).
   Adaptations: grid forced to 3 columns for this 3-tile reveal; vt-map iframe given a direct src
   (master lazy-loads via data-counter-src); client tokens neutralised to generic workplace copy. ═══ */
.wyg-band{background:var(--pa);padding:clamp(56px,8vw,104px) 0;}
.vstack-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(12px,1.4vw,18px);margin-top:clamp(28px,4vw,48px);}
@media(max-width:900px){.vstack-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:560px){.vstack-grid{grid-template-columns:1fr;}}
.vtile{margin:0;display:flex;flex-direction:column;position:relative;
  opacity:0;transform:translateY(20px) scale(.985);
  transition:opacity .55s cubic-bezier(.2,.7,.2,1),transform .55s cubic-bezier(.2,.7,.2,1);}
.vstack-grid.in .vtile{opacity:1;transform:none;}
.vstack-grid.in .vtile:nth-child(1){transition-delay:0s;}
.vstack-grid.in .vtile:nth-child(2){transition-delay:.09s;}
.vstack-grid.in .vtile:nth-child(3){transition-delay:.18s;}
.vstack-grid.in .vtile:nth-child(4){transition-delay:.27s;}
@media(prefers-reduced-motion:reduce){.vtile{transition:none;opacity:1;transform:none;}}
.vtile img,.vtile video{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;border:2px solid var(--nb);background:#16301f;}
.vtile figcaption{font-size:13px;line-height:1.45;color:var(--nb);margin-top:10px;}
.vtile figcaption b{display:block;font-family:var(--font-bs);font-weight:800;font-size:15px;text-transform:uppercase;letter-spacing:-.01em;color:var(--nb);margin-bottom:3px;}
.vtile figcaption em{color:var(--or);font-style:italic;}
.vtile.is-empty{display:none;}
/* servicing self-scheduling demo, as a compact tile */
.vt-svc .svc-tile-stage{position:relative;width:100%;aspect-ratio:4/3;border:2px solid var(--nb);
  background:#15171a;border-radius:0;overflow:hidden;display:flex;flex-direction:column;justify-content:center;
  gap:5px;padding:12px 12px;}
.svc-tile-thread{display:flex;flex-direction:column;gap:5px;}
.vt-svc .q-mail{opacity:0;transform:translateY(6px);transition:opacity .4s ease,transform .4s ease;
  border-radius:8px;padding:6px 9px;font-size:10px;line-height:1.35;max-width:88%;}
.vt-svc .q-mail.in{opacity:1;transform:none;}
.vt-svc .q-mail--nofilter{background:rgba(238,77,23,.16);border:1px solid rgba(238,77,23,.35);align-self:flex-start;color:#f4efe2;}
.vt-svc .q-mail--accenture{background:rgba(161,0,255,.15);border:1px solid rgba(161,0,255,.4);align-self:flex-end;color:#f4efe2;}
.vt-svc .q-mail--servicer{background:rgba(120,224,168,.13);border:1px solid rgba(120,224,168,.35);align-self:flex-start;color:#f4efe2;}
.vt-svc .q-mail--system{background:transparent;align-self:center;color:rgba(244,239,226,.55);font-size:9px;padding:2px 6px;}
.vt-svc .q-mail-from{font-family:var(--font-m,monospace);font-size:8px;letter-spacing:.04em;text-transform:uppercase;opacity:.7;margin-bottom:2px;}
.vt-svc .q-mail-body b{color:#fff;}
.vt-svc .q-chip{display:inline-block;margin-left:5px;padding:1px 6px;border-radius:20px;font-size:8.5px;font-weight:600;}
.vt-svc .q-chip--confirm{background:rgba(120,224,168,.25);color:#a8f0c8;}
.vt-svc .q-mail-locked{color:#a8f0c8;font-weight:600;}
.svc-tile-replay{position:absolute;top:8px;right:8px;z-index:3;background:rgba(244,239,226,.12);color:#f4efe2;
  border:1px solid rgba(244,239,226,.28);border-radius:50%;width:24px;height:24px;font-size:11px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;padding:0;transition:.15s;}
.svc-tile-replay:hover{background:var(--or);border-color:var(--or);}
/* GIS evidence map — live iframe tile */
.vt-map .vt-map-frame{position:relative;width:100%;aspect-ratio:4/3;overflow:hidden;background:#0b1f14;border:2px solid var(--nb);}
.vt-map .vt-map-frame iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0;display:block;}
.vt-map .vt-map-open{position:absolute;inset:0;z-index:2;display:flex;align-items:flex-end;justify-content:flex-start;
  padding:12px;text-decoration:none;background:linear-gradient(180deg,rgba(11,31,20,0) 55%,rgba(11,31,20,.55) 100%);
  opacity:0;transition:opacity .25s ease;}
.vt-map .vt-map-open:hover,.vt-map .vt-map-open:focus-visible{opacity:1;}
.vt-map .vt-map-open span{font-family:var(--font-m,monospace);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  color:#f4efe2;background:rgba(20,20,18,.72);border:1px solid rgba(244,239,226,.4);border-radius:20px;padding:6px 13px;line-height:1;}

.wyg-cta{text-align:center;margin-top:clamp(30px,4.5vw,54px);}
.wyg-cta a{display:inline-block;background:var(--or);color:#fff;font-family:var(--font-b);font-weight:700;font-size:16px;padding:16px 34px;border-radius:12px;text-decoration:none;box-shadow:0 12px 30px rgba(238,77,23,.28);transition:filter .15s,transform .1s;}
.wyg-cta a:hover{filter:brightness(1.05);transform:translateY(-1px);}

.th-note{position:fixed;left:12px;bottom:12px;z-index:50;font-family:var(--font-m);font-size:11px;letter-spacing:.06em;color:var(--gy);background:rgba(255,255,255,.85);padding:6px 10px;border-radius:7px;}
</style>
</head>
<body>

<section class="wyg-band">
  <div class="wrap">
    <div class="eyebrow" style="text-align:center;">You&rsquo;re in &middot; what runs behind the scenes</div>
    <h2 class="sec-title" style="text-align:center;font-size:clamp(30px,4.6vw,58px);">The part you don&rsquo;t<br>have to think about.</h2>

    <div class="vstack-grid" id="vgrid">
      <!-- the counter, telling its story — real tablet tile, live board with the named greeting (harvested verbatim) -->
      <figure class="vtile vt-counter">
        <div class="vt-counter-frame"><div class="vt-tablet"><div class="vt-tablet-screen"><iframe data-counter-src="nofilter-counter.html" loading="lazy" title="Live split-flap counter — the message on the board" scrolling="no" allow="autoplay"></iframe></div></div></div>
        <figcaption><b>The counter, telling its story</b>On the screen it does more than count: it greets whoever&rsquo;s next by name, counts their cup, and marks the moment your workplace crosses a milestone &mdash; live, right where they&rsquo;re waiting. <em>Their cup, on the board.</em></figcaption>
      </figure>

      <!-- servicing self-scheduling — harvested verbatim (client tokens neutralised) -->
      <figure class="vtile vt-svc">
        <div class="svc-tile-stage">
          <div class="svc-tile-thread" id="qThread">
            <div class="q-mail q-mail--nofilter" data-step="1"><div class="q-mail-from">NoFilter &rarr; your workplace</div><div class="q-mail-body">Q1 service is due. Proposed <b>Tue 2 Feb, 10:00</b>, both units.</div></div>
            <div class="q-mail q-mail--accenture" data-step="2"><div class="q-mail-from">Your workplace &middot; Facilities</div><div class="q-mail-body">Works for us.<span class="q-chip q-chip--confirm">&#10003; Date confirmed</span></div></div>
            <div class="q-mail q-mail--servicer" data-step="3"><div class="q-mail-from">Machine Servicer</div><div class="q-mail-body"><span class="q-chip q-chip--confirm">&#10003; Date confirmed</span></div></div>
            <div class="q-mail q-mail--system" data-step="4"><div class="q-mail-body"><span class="q-mail-locked">Locked &middot; both calendars &middot; reminder 3wks prior</span></div></div>
          </div>
          <button class="svc-tile-replay" id="qSvcReplay" aria-label="Replay">&#9656;</button>
        </div>
        <figcaption><b>Servicing schedules itself</b>Servicing that never slips through the cracks. Our semi-automated system pings both you and the Machine Servicer three weeks ahead of every scheduled date, so no one forgets and nothing gets missed &mdash; which keeps the machines running well for longer.</figcaption>
      </figure>

      <!-- mapped on the evidence — live GIS map (direct src for the prototype) -->
      <figure class="vtile vt-map">
        <div class="vt-map-frame">
          <iframe src="https://nofilter-gis-map.netlify.app/" loading="lazy" title="NoFilter conservation GIS evidence map" scrolling="no"></iframe>
          <a class="vt-map-open" href="https://nofilter-gis-map.netlify.app/" target="_blank" rel="noopener" aria-label="Open the full interactive evidence map"><span>Explore the map &rarr;</span></a>
        </div>
        <figcaption><b>Mapped, on the evidence</b>Conservation only counts if the claim holds up. So NoFilter checks, at the back end, that the forest really is staying protected: satellite images, the NGO teams on the ground, and drone mapping from this year. This interactive map is where you can see it for yourself.</figcaption>
      </figure>

      <!-- where the money lands — harvested verbatim (client token neutralised) -->
      <figure class="vtile">
        <video autoplay muted loop playsinline preload="metadata" onerror="this.closest('.vtile').classList.add('is-empty');"><source src="https://nofilter-shared.netlify.app/mech-group.mp4" type="video/mp4"></video>
        <figcaption><b>Where the money lands</b>The 5&ndash;10% contribution goes straight to the NGO partners holding the line. Every transfer is documented and shown to you, and about once a year NoFilter reports back with footage from the source: what your contribution did, and the places and people it reached. A yearly look your team can share.</figcaption>
      </figure>
    </div>

    <div class="wyg-cta"><a href="workplace-builder.html#build">Build your quote &rarr;</a></div>
  </div>
</section>

<div class="th-note">TEST — private reveal preview</div>

<script>
/* tablet counter — lazy-load the board + mute/arm on visibility (harvested verbatim from the Part 2 master) */
(function(){
  // load deferred iframes (counter board) only when scrolled into view
  var frames = document.querySelectorAll('iframe[data-counter-src]');
  if(frames.length){
    var load=function(f){ if(!f.src){ f.src = f.getAttribute('data-counter-src'); } };
    if(!('IntersectionObserver' in window)){ frames.forEach(load); }
    else { var lio=new IntersectionObserver(function(es){ es.forEach(function(en){ if(en.isIntersecting){ load(en.target); lio.unobserve(en.target); } }); },{threshold:0.25}); frames.forEach(function(f){ lio.observe(f); }); }
  }
  // sound + arm follow visibility: in view = unmute, gone = mute
  var counterIframe = document.querySelector('.vt-counter iframe');
  var counterTile = document.querySelector('.vtile.vt-counter');
  function postMute(val){ if(counterIframe && counterIframe.contentWindow){ try{ counterIframe.contentWindow.postMessage({type:'nf-mute',muted:val},'*'); }catch(e){} } }
  function postArm(){ if(counterIframe && counterIframe.contentWindow){ try{ counterIframe.contentWindow.postMessage({type:'nf-arm'},'*'); }catch(e){} } }
  ['pointerdown','keydown','touchstart','wheel','scroll'].forEach(function(ev){ window.addEventListener(ev, postArm, {capture:true, passive:true}); });
  if(counterTile && 'IntersectionObserver' in window){ var o=new IntersectionObserver(function(es){ es.forEach(function(e){ postArm(); postMute(!e.isIntersecting); }); },{threshold:0.35}); o.observe(counterTile); }
  if(counterIframe){ counterIframe.addEventListener('load', function(){ postMute(true); }); }
})();

/* tiles reveal + servicing email-thread animation — harvested verbatim from the Part 2 master */
(function(){
  var grid=document.getElementById('vgrid');
  if(grid && 'IntersectionObserver' in window){ var gio=new IntersectionObserver(function(es){ es.forEach(function(e){ if(e.isIntersecting){ grid.classList.add('in'); gio.disconnect(); } }); },{threshold:.2}); gio.observe(grid); } else if(grid){ grid.classList.add('in'); }

  var thread=document.getElementById('qThread');
  if(thread){
    var mails=[].slice.call(thread.querySelectorAll('.q-mail'));
    var delays=[500,1700,2800,3700,4900];
    var timers=[];
    function play(){
      timers.forEach(clearTimeout); timers=[];
      mails.forEach(function(m){m.classList.remove('in');});
      mails.forEach(function(m,i){ timers.push(setTimeout(function(){m.classList.add('in');}, delays[i])); });
      timers.push(setTimeout(play, delays[delays.length-1]+4500));
    }
    var replay=document.getElementById('qSvcReplay');
    if(replay) replay.addEventListener('click',play);
    if('IntersectionObserver' in window){
      var io=new IntersectionObserver(function(es){ es.forEach(function(e){ if(e.isIntersecting){ play(); io.disconnect(); } }); },{threshold:.25});
      io.observe(thread);
    } else { play(); }
  }
})();
</script>
</body>
</html>
