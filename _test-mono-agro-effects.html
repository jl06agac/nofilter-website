<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEST — monocrop → agroforestry: effect options</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;900&family=Archivo:wght@0,400;0,500;0,600;0,700&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{ --or:#ed3326; --cr:#F4F2EE; --pa:#EDE7D9; --nb:#1A1815; --font-display:"Big Shoulders Display",sans-serif; --font-b:"Archivo",Arial,sans-serif; --font-m:"IBM Plex Mono",monospace; --font-s:"Source Serif 4",Georgia,serif; }
*{box-sizing:border-box;} body{margin:0;font-family:var(--font-b);background:var(--pa);color:var(--nb);}
.spacer{height:56vh;display:flex;align-items:center;justify-content:center;font-family:var(--font-m);font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:#8a8378;}

/* ═══ CONTAINED media panel behind the header (not full-bleed) ═══ */
.maf{background:var(--pa);padding:clamp(44px,7vw,90px) 0;}
.maf-stage{position:relative;max-width:1180px;margin:0 auto;min-height:min(64vh,560px);border-radius:16px;overflow:hidden;
  background:#14110d;box-shadow:0 34px 80px -36px rgba(26,24,21,.5);display:flex;align-items:center;}
.maf-agro,.maf-mono{position:absolute;inset:0;width:100%;height:100%;}
.maf-agro{object-fit:cover;opacity:0;will-change:opacity,transform,clip-path;}
.maf-mono{background-size:cover;background-position:center;opacity:0;will-change:opacity,transform,filter;}
.maf-scrim{position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(20,17,13,.86) 0%,rgba(20,17,13,.42) 58%,rgba(20,17,13,.15) 100%);opacity:.55;transition:opacity .6s ease;}
.maf-stage.lit .maf-scrim{opacity:1;}
.maf-inner{position:relative;z-index:2;padding:clamp(28px,5vw,64px);color:#fff;}
.maf-eyebrow{font-family:var(--font-m);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#ffb9a6;margin-bottom:14px;}
.maf-head{font-family:var(--font-display);font-weight:900;text-transform:uppercase;line-height:.94;letter-spacing:-.015em;font-size:clamp(30px,5vw,72px);margin:0;color:#fff;}
.maf-hot{color:var(--or);}
.maf-sub{font-family:var(--font-s);font-size:clamp(17px,1.9vw,24px);color:rgba(255,255,255,.92);margin:20px 0 0;max-width:34ch;opacity:0;transform:translateY(10px);transition:opacity .6s ease .1s,transform .6s ease .1s;}
.maf-stage.lit .maf-sub{opacity:1;transform:none;}
.maf-sub .o{color:var(--or);font-style:italic;}

@media(prefers-reduced-motion:reduce){.maf-agro,.maf-mono,.maf-scrim,.maf-sub{transition:none !important;}}

/* test harness */
.th-bar{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap;padding:10px;background:rgba(6,5,4,.93);color:#fff;font-family:var(--font-m);font-size:11px;letter-spacing:.04em;}
.th-bar label{display:inline-flex;gap:6px;align-items:center;opacity:.85;}
.th-bar select{font-family:var(--font-m);font-size:11px;padding:4px 6px;border-radius:5px;}
.th-bar button{font-family:var(--font-m);font-size:11px;letter-spacing:.08em;text-transform:uppercase;background:var(--or);color:#fff;border:none;border-radius:7px;padding:8px 15px;cursor:pointer;}
.th-bar .n{opacity:.55;}
</style>
</head>
<body>

<div class="spacer">↓ scroll — the transition fires once when the panel enters view ↓</div>

<section class="maf">
  <div class="maf-stage" id="stage">
    <video class="maf-agro" id="agro" src="atwork-loop.mp4" poster="atwork-loop-poster.jpg" muted loop playsinline preload="auto"></video>
    <div class="maf-mono" id="mono" style="background-image:url('coffee-plantation.jpg')"></div>
    <div class="maf-scrim"></div>
    <div class="maf-inner">
      <div class="maf-eyebrow">What most coffee does</div>
      <h2 class="maf-head">Most coffee is grown<br>where it&rsquo;s <span class="maf-hot">cheapest</span>.</h2>
      <p class="maf-sub">Ours grows where it <span class="o">matters most</span> &mdash; on the standing edge, under canopy.</p>
    </div>
  </div>
</section>

<div class="spacer">↑ that's the beat ↑</div>

<div class="th-bar">
  <span class="n">TEST — pick a transition:</span>
  <label>effect
    <select id="fx">
      <option value="flash">Flash (2 blinks)</option>
      <option value="crossfade">Crossfade / dissolve</option>
      <option value="wipe">Wipe reveal</option>
      <option value="zoom">Zoom-punch (blur out)</option>
      <option value="glitch">Glitch / stutter</option>
    </select>
  </label>
  <label>monocrop
    <select id="monoPick">
      <option value="coffee-plantation.jpg">coffee plantation</option>
      <option value="deforestation-image.jpg">deforestation</option>
    </select>
  </label>
  <button id="replay" type="button">&#9654; Replay</button>
</div>

<script>
(function(){
  var stage = document.getElementById('stage');
  var agro  = document.getElementById('agro');
  var mono  = document.getElementById('mono');
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  var current = 'flash';

  function playAgro(){ var p = agro.play(); if(p && p.catch) p.catch(function(){}); }
  function revealText(){ stage.classList.add('lit'); }

  function clearStyles(el){ ['opacity','transition','transform','filter','clipPath','webkitClipPath'].forEach(function(p){ el.style[p]=''; }); }
  function reset(){
    stage.classList.remove('lit');
    clearStyles(mono); clearStyles(agro);
    mono.style.opacity = '0'; agro.style.opacity = '0';
    try{ agro.pause(); agro.currentTime = 0; }catch(e){}
  }

  var EFFECTS = {
    flash: function(){
      [[0,'1'],[130,'0'],[270,'1'],[450,'0']].forEach(function(x){ setTimeout(function(){ mono.style.opacity = x[1]; }, x[0]); });
      setTimeout(function(){ agro.style.opacity = '1'; playAgro(); revealText(); }, 450);
    },
    crossfade: function(){
      mono.style.transition = 'opacity .85s ease';
      agro.style.transition = 'opacity .85s ease';
      mono.style.opacity = '1'; playAgro();
      requestAnimationFrame(function(){ requestAnimationFrame(function(){
        mono.style.opacity = '0'; agro.style.opacity = '1'; revealText();
      }); });
    },
    wipe: function(){
      mono.style.opacity = '1'; agro.style.opacity = '1';
      agro.style.clipPath = 'inset(0 100% 0 0)'; agro.style.webkitClipPath = 'inset(0 100% 0 0)';
      playAgro();
      requestAnimationFrame(function(){ requestAnimationFrame(function(){
        agro.style.transition = 'clip-path .9s cubic-bezier(.4,0,.2,1),-webkit-clip-path .9s cubic-bezier(.4,0,.2,1)';
        agro.style.clipPath = 'inset(0 0 0 0)'; agro.style.webkitClipPath = 'inset(0 0 0 0)';
      }); });
      setTimeout(function(){ mono.style.opacity = '0'; revealText(); }, 520);
    },
    zoom: function(){
      mono.style.opacity = '1'; mono.style.transition = 'transform .8s cubic-bezier(.4,0,.2,1),opacity .7s ease,filter .7s ease';
      agro.style.opacity = '0'; agro.style.transform = 'scale(1.18)'; agro.style.transition = 'transform .9s cubic-bezier(.3,0,.2,1),opacity .6s ease';
      playAgro();
      requestAnimationFrame(function(){ requestAnimationFrame(function(){
        mono.style.transform = 'scale(1.28)'; mono.style.filter = 'blur(9px)'; mono.style.opacity = '0';
        agro.style.opacity = '1'; agro.style.transform = 'scale(1)';
        revealText();
      }); });
    },
    glitch: function(){
      mono.style.opacity = '1';
      var steps = [[0,'translate(0,0)'],[70,'translate(-6px,2px)'],[130,'translate(5px,-3px)'],[190,'translate(-3px,1px)'],[250,'translate(4px,2px)'],[310,'translate(0,0)']];
      steps.forEach(function(s){ setTimeout(function(){ mono.style.transform = s[1]; mono.style.filter = (s[0]%2? 'hue-rotate(-15deg) contrast(1.3)':'none'); }, s[0]); });
      setTimeout(function(){
        agro.style.opacity = '1'; agro.style.transform = 'translate(4px,-2px)'; playAgro();
        mono.style.opacity = '0';
        setTimeout(function(){ agro.style.transition='transform .18s ease'; agro.style.transform='translate(0,0)'; revealText(); }, 90);
      }, 360);
    }
  };

  function run(){
    reset();
    requestAnimationFrame(function(){
      if(reduce){ agro.style.opacity='1'; playAgro(); revealText(); return; }
      (EFFECTS[current] || EFFECTS.flash)();
    });
  }

  if('IntersectionObserver' in window){
    var io = new IntersectionObserver(function(es){ es.forEach(function(e){ if(e.isIntersecting){ io.disconnect(); run(); } }); }, { threshold: 0.55 });
    io.observe(stage);
  } else { run(); }

  document.getElementById('fx').addEventListener('change', function(){ current = this.value; run(); });
  document.getElementById('monoPick').addEventListener('change', function(){ mono.style.backgroundImage = "url('" + this.value + "')"; run(); });
  document.getElementById('replay').addEventListener('click', run);
})();
</script>
</body>
</html>
