/* ── 12 · RECEIPT ─────────────────────────────────────────────────────── */
function buildReceipt(c, who){
  var d = new Date();
  var wrap = document.createElement('div');
  wrap.className = 'receipt';
  var h = '';
  h += '<h4>NOFILTER</h4>';
  h += '<div class="rsub">Hold the line · quote receipt</div>';
  h += '<hr>';
  h += '<div class="rr"><span class="rk">REF</span><span>' + QREF + '</span></div>';
  h += '<div class="rr"><span class="rk">ISSUED</span><span>' + utcStamp(d) + '</span></div>';
  h += '<div class="rr"><span class="rk">MARKET</span><span>' + MKT.name + ' · ' + MKT.cur + '</span></div>';
  h += '<div class="rr"><span class="rk">FOR</span><span>' + (who.company || who.name || '—') + '</span></div>';
  h += '<div class="rr"><span class="rk">FLOOR</span><span>' + who.size + '</span></div>';
  h += '<hr>';
  if(c.machLines.length){
    h += '<div class="rr"><span class="rk">MACHINES</span><span></span></div>';
    c.machLines.forEach(function(l){
      var val = l.kind === 'note' ? '—' : money(l.v) + (l.kind==='mo'?'':' *');
      h += '<div class="rr"' + (l.sub ? ' style="opacity:.8;padding-left:12px"' : '') +
           '><span>' + l.n + '</span><span>' + val + '</span></div>';
    });
    if(c.machMonthly > 0) h += '<div class="rr"><span class="rk">MACHINE / MO</span><span>' + money(c.machMonthly) + '</span></div>';
    if(c.rentEquiv > 0){
      h += '<div class="rr"><span class="rk">SAME UNITS, RENTED</span><span>' + money(c.rentEquiv) + '</span></div>';
      h += '<div class="rr"><span class="rk">' + (c.rentEquiv >= c.capex ? 'BUYING COSTS LESS BY' : 'BUYING COSTS MORE BY') +
           '</span><span>' + money(Math.abs(c.rentEquiv - c.capex)) + '</span></div>';
      if(c.buyGaps > 0) h += '<div class="rr" style="opacity:.75"><span>NOT LIKE-FOR-LIKE &middot; ' + c.buyGaps +
           ' DECLINED</span><span>&mdash;</span></div>';
    }
  }
  if(c.coffeeLines.length){
    h += '<hr><div class="rr"><span class="rk">COFFEE @ ' + Q.price.toFixed(2) + '/KG</span><span>' + c.kgTotal + ' KG</span></div>';
    c.coffeeLines.forEach(function(l){
      h += '<div class="rr"><span>' + l.n + '</span><span>' + money(l.v) + '</span></div>';
    });
    h += '<div class="rr"><span class="rk">COFFEE / MO</span><span>' + money(c.coffee) + '</span></div>';
  }
  h += '<hr>';
  h += '<div class="rr big"><span>TOTAL / MONTH</span><span>' + CUR() + money(c.total) + '</span></div>';
  if(c.capex > 0) h += '<div class="rr"><span class="rk">* ONE-TIME CAPITAL</span><span>' + CUR() + money(c.capex) + '</span></div>';
  h += '<div class="rc"><div class="rr"><span>TO CONSERVATION · ' + window.__nfPct(c.band.rate) + '%</span>' +
       '<span>' + CUR() + money(c.contrib) + '</span></div>' +
       '<div class="rr" style="opacity:.75"><span>PER YEAR</span><span>' + CUR() + money0(c.contrib*12) + '</span></div></div>';
  if(who.tasteShow || who.tasteSite){
    h += '<hr><div class="rr"><span class="rk">TASTING REQUESTED</span><span></span></div>';
    if(who.tasteShow) h += '<div class="rr"><span>Showroom</span><span>NO CHARGE</span></div>';
    if(who.tasteSite) h += '<div class="rr"><span>On site</span><span>QUOTED &middot; 50% BACK</span></div>';
  }
  h += '<div class="barcode"></div>';
  h += '<div class="rfoot">Partner NGOs: PRCF Indonesia · SRI · OIC · GJI<br>Fauna &amp; Flora Myanmar · ACCA<br>' +
       'Polygons signed · satellite live · drone + ground 2026<br>' +
       /* 28 Aug (pass152): was "Indicative. Placeholder pricing. Not a contract."
          The middle sentence told a buyer holding a priced quote that we invented
          the figures - written when nothing had shipped, indefensible on a live
          site. "Indicative" already means "real numbers, not a binding offer",
          and it stays honest whatever the open UAE machine rates settle at. */
       'Indicative pricing. Not a contract.</div>';
  wrap.innerHTML = h;
  var bc = $('.barcode', wrap), rnd = mulberry32(seedOf(QREF));
  for(var i=0;i<58;i++){
    var b = document.createElement('i');
    b.style.height = (10 + Math.floor(rnd()*24)) + 'px';
    b.style.width = (rnd() > 0.72 ? 3 : 1.5) + 'px';
    bc.appendChild(b);
  }
  return wrap;
}

/* named + re-bindable: a reset restores #sendPanel's markup, which creates a
   fresh <form> the old listener is not attached to. */
function nfQuoteSubmit(ev){
  ev.preventDefault();   /* nothing is posted from the page itself — see the note below */

  /* ── 28 Aug (pass148) · required fields ────────────────────────────────
     Name, company and email must be there; phone is optional. Checked here
     rather than by the browser because the form is novalidate: a native
     validation bubble is unstyleable OS chrome and would read as a system
     error on this console. The email test is loose on purpose — the job is to
     catch a company name typed into the email box, not to adjudicate RFC 5322,
     and a strict pattern rejects real addresses. */
  var REQUIRED = [
    { sel:'#fName',  label:'name' },
    { sel:'#fCo',    label:'company' },
    { sel:'#fEmail', label:'work email', test:function(v){ return /^[^@\s]+@[^@\s.]+\.[^@\s]+$/.test(v); } }
  ];
  var missing = [];
  REQUIRED.forEach(function(f){
    var el = $(f.sel); if(!el) return;
    var v = (el.value || '').trim();
    var ok = v.length > 0 && (!f.test || f.test(v));
    el.setAttribute('aria-invalid', ok ? 'false' : 'true');
    var fld = el.closest ? el.closest('.fld') : null;
    if(fld) fld.classList.toggle('is-bad', !ok);
    if(!ok) missing.push(el);
  });
  if(missing.length){
    var st0 = $('#sendState');
    if(st0) st0.textContent = missing.length === 1 ? 'ONE FIELD MISSING' : missing.length + ' FIELDS MISSING';
    /* clear the marker as they fix it, not on the next submit — being told you
       are still wrong while you are correcting it is what makes a form hostile */
    missing.forEach(function(el){
      if(el.__nfWatch) return;
      el.__nfWatch = true;
      el.addEventListener('input', function(){
        var fld = el.closest ? el.closest('.fld') : null;
        if(fld) fld.classList.remove('is-bad');
        el.setAttribute('aria-invalid','false');
        var st = $('#sendState'); if(st && /MISSING/.test(st.textContent)) st.textContent = 'READY';
      });
    });
    try { missing[0].focus({ preventScroll:false }); } catch(e){ missing[0].focus(); }
    return;
  }

  var c = compute();
  var who = { name:$('#fName').value.trim(), company:$('#fCo').value.trim(),
              email:$('#fEmail').value.trim(),
              phone:($('#fPhone') ? $('#fPhone').value.trim() : ''),   /* pass141 */
              size:$('#fSize').value,
              /* read BEFORE the panel body is replaced below — the checkboxes
                 live inside it and are destroyed with it */
              tasteShow: !!($('#fTasteShow') && $('#fTasteShow').checked),
              tasteSite: !!($('#fTasteSite') && $('#fTasteSite').checked) };
  /* 28 Aug (pass142) — the confirmation email. Fire-and-forget: this must never be
     able to hold up or break the on-screen confirmation, so there is no await, no
     spinner, and the catch is deliberately silent. It fails harmlessly on a file://
     preview and on any deploy where RESEND_API_KEY has not been set yet, and the
     reader sees exactly what they see today. See netlify/functions/quote-confirm.js. */
  if(who.email && typeof fetch === 'function'){
    try {
      fetch('/.netlify/functions/quote-confirm', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: who.email, name: who.name, company: who.company, phone: who.phone,
          size: who.size, tasteShow: who.tasteShow, tasteSite: who.tasteSite,
          market: (window.__nfCur || ''), ref: (typeof QREF === 'string' ? QREF : ''),
          /* 28 Aug (pass157) - WHAT THEY CHOSE, not just who they are. Until now
             this payload carried contact details only, so the internal email knew
             less than the Netlify Forms backstop added in pass156. Same source in
             both: compute()'s own coffeeLines/machLines. */
          coffee:   (c && c.coffeeLines ? c.coffeeLines : []).map(function(l){ return l.n; }),
          machines: (c && c.machLines   ? c.machLines   : []).map(function(l){ return l.n; }),
          total:    (c && c.total   != null) ? c.total   : null,
          capex:    (c && c.capex   != null) ? c.capex   : null,
          contrib:  (c && c.contrib != null) ? c.contrib : null,
          kg:       (c && c.kgTotal != null) ? c.kgTotal : null,
          /* block 85 — the per-kilo figures the desk email prints */
          price:     (typeof Q === 'object' && Q.price != null) ? Q.price : null,
          rate:      (c && c.band && c.band.rate != null) ? c.band.rate : null,
          topUpKg:   (c && c.topPerKg) ? c.topPerKg : null,
          topUpMo:   (c && c.topPerKg && c.kgTotal) ? c.topPerKg * c.kgTotal : null,
          consPerKg: (c && c.bandPerKg != null) ? c.bandPerKg + (c.topPerKg || 0) : null,
          /* block 104 — servicing in its own right, and the machine money,
             which is a fact rather than a function of an estimated volume */
          servicing:  (c && c.svcLines) ? c.svcLines : [],
          machMonthly:(c && c.machMonthly != null) ? c.machMonthly : null,
          cupsY:     (c && c.kgTotal && window.__nfVolCups) ? window.__nfVolCups() : null   /* block 109 */
        })
      }).catch(function(){});
    } catch(e){}
  }

  /* ── 28 Aug (pass156) · THE LEAD IS RECORDED, WHATEVER ELSE FAILS ───────
     Netlify Forms. Fire-and-forget for the same reason the call above is: this
     must never be able to delay or break the on-screen confirmation, so there is
     no await and the catch is silent. It posts urlencoded to '/' with a
     form-name, which is what Netlify's collector expects — JSON is rejected.

     It duplicates the confirmation call rather than replacing it, deliberately.
     They answer different questions: Resend tells the CUSTOMER we received it,
     this tells US it happened. Losing the second is the expensive one, and it is
     the one with no dependencies. */
  if(typeof fetch === 'function'){
    try {
      var band = (c && c.band) ? c.band : {};
      var nfForm = {
        'form-name'       : 'quote',
        name              : who.name,
        company           : who.company,
        email             : who.email,
        phone             : who.phone,
        headcount         : who.size,
        market            : (typeof MKTK === 'string' ? MKTK : ''),
        currency          : (window.__nfCur || ''),
        ref               : (typeof QREF === 'string' ? QREF : ''),
        tasting_showroom  : who.tasteShow ? 'yes' : 'no',
        tasting_onsite    : who.tasteSite ? 'yes' : 'no',
        monthly_total     : (c && c.total   != null) ? String(c.total)   : '',
        one_time_capital  : (c && c.capex   != null) ? String(c.capex)   : '',
        to_conservation   : (c && c.contrib != null) ? String(c.contrib) : '',
        band_rate         : (band.rate != null) ? String(band.rate) : '',
        /* block 85 — same per-kilo figures as the confirmation email */
        coffee_price_kg   : (typeof Q === 'object' && Q.price != null) ? String(Q.price) : '',
        topup_kg          : (c && c.topPerKg) ? String(c.topPerKg) : '',
        conservation_kg   : (c && c.bandPerKg != null) ? String(c.bandPerKg + (c.topPerKg || 0)) : '',
        /* compute() returns kgTotal/coffee/machMonthly/units/coffeeLines/machLines.
           An earlier draft of this posted c.vol, which does not exist — it came
           back empty in the intercept test, which is exactly why the POST gets
           intercepted and read rather than eyeballed. */
        coffee_kg         : (c && c.kgTotal     != null) ? String(c.kgTotal)     : '',
        coffee_monthly    : (c && c.coffee      != null) ? String(c.coffee)      : '',
        machines_monthly  : (c && c.machMonthly != null) ? String(c.machMonthly) : '',
        machine_units     : (c && c.units       != null) ? String(c.units)       : '',
        /* WHAT THEY ACTUALLY CHOSE. The first draft captured only the totals,
           which tells you a lead is worth $X and nothing about how to answer it.
           These two lines are the ones worth reading first in the notification. */
        coffee_selected   : (c && c.coffeeLines ? c.coffeeLines : []).map(function(l){ return l.n; }).join(' | '),
        machines_selected : (c && c.machLines   ? c.machLines   : []).map(function(l){ return l.n; }).join(' | '),
        submitted_at      : new Date().toISOString(),
        page              : (location.hostname || '')
      };
      var body = Object.keys(nfForm).map(function(k){
        return encodeURIComponent(k) + '=' + encodeURIComponent(nfForm[k] == null ? '' : nfForm[k]);
      }).join('&');
      fetch('/', {
        method : 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body   : body
      }).catch(function(){});
    } catch(e){}
  }

  $('#sendState').textContent = 'SENT ✓';
  var panel = $('#sendPanel .panel-bd');
  if(panel.__nfOrig == null) panel.__nfOrig = panel.innerHTML;   /* for the reset */
  panel.textContent = '';
  var ok = document.createElement('div');
  ok.className = 'sent';
  ok.innerHTML = '<div class="kick">Confirmed</div>' +
    '<h3 class="d3" style="margin:10px 0 12px">Quote ' + QREF + ' logged.</h3>' +
    '<p class="body-sm" style="margin:0 auto">' +
      (who.email ? ('We would send it to <b style="color:var(--cream)">' + who.email + '</b>. ') : '') +
      'Not yet, though \u2014 this is a preview, so your quote is laid out below rather than sent.</p>';   /* pass141 */
  panel.appendChild(ok);

  /* ES's received state (ES-LIVE.html:6382-6392): the settle card takes itself
     over in place — form out, .q-sent on, #qThanks in. No printed receipt beat;
     Eastspring has no such idiom. buildReceipt() is untouched and still
     available, it simply no longer fires here. */
  var settle = document.querySelector('.q-sheet.q-settle');
  var thanks = document.getElementById('qThanks');
  /* block 104 — the offer panel itself is gone: the tasting choices are
     checkboxes on the form they just sent, so offering again asked twice.
     This block removed it when a tasting HAD been ticked; with no panel to
     remove it now returns on its first line, every time. */
  (function(){
    var offer = thanks && thanks.querySelector('.q-thanks-offer');
    if(!offer) return;
    /* ── 28 Aug (pass151) ────────────────────────────────────────────────
       Alex: "if the user selects a tasting, we don't need the 'Tasting
       requested' message in addition to the general post-submission message.
       it's superfluous and repetitive."

       It was, and by more than one. A reader who ticks the showroom box has
       already been told the terms on the checkbox itself ("— no charge") and
       again in the docket ("Showroom · NO CHARGE"); this card made it three.
       The general message above already answers the whole submission.

       So the block is REMOVED when they asked, and KEPT when they did not —
       for someone who ticked nothing, "Want to taste it first?" is the only
       place the option is offered at all, and that is the one job this panel
       was ever doing. */
    if(!who.tasteShow && !who.tasteSite) return;    /* not asked — the standing offer stands */
    if(offer.parentNode) offer.parentNode.removeChild(offer);
  })();
  if(settle && thanks){
    var sp = document.getElementById('sendPanel');
    if(sp) sp.style.display = 'none';
    settle.classList.add('q-sent');
    /* block 104 */
    var tref = document.getElementById('qThanksRef');
    if(tref && typeof QREF === 'string' && QREF){
      tref.innerHTML = 'Your reference \u00b7 <b>' + QREF + '</b>'; tref.hidden = false;
    }
    settle.appendChild(thanks);
    thanks.hidden = false;
    if(settle.scrollIntoView) settle.scrollIntoView({ behavior: RM ? 'auto' : 'smooth', block:'center' });
    /* hold the received card while its choreography lands, then close the
       builder and return to the top of the site — ES does the same thing at
       3.8s (it releases its gated sections and glides on; we have no gate, so
       the equivalent is dropping focus mode and going home). */
    setTimeout(function(){
      /* fade to black, swap in the dark, lift the black onto the intro — the
         same handover the CRT uses coming the other way (see pass57). */
      var veil = document.createElement('div');
      veil.className = 'nf-xfade';
      document.body.appendChild(veil);
      requestAnimationFrame(function(){ veil.classList.add('is-on'); });
      setTimeout(function(){
        var x = document.getElementById('nfxClose');
        if(x) x.click();
        /* back to the INTRO route, not the top of the quote route — the hash was
           still #quote, so a plain scroll-to-top left the reader on the builder.
           Setting the hash runs the router's own path (hashchange -> fromHash ->
           go('home')), which also resets scroll and re-arms that route's video. */
        if(location.hash !== '#home') location.hash = '#home';
        else window.scrollTo({ top:0, behavior:'auto' });
        /* two frames so the route swap has painted before the black lifts */
        requestAnimationFrame(function(){ requestAnimationFrame(function(){
          veil.classList.remove('is-on');
        }); });
        setTimeout(function(){ if(veil.parentNode) veil.parentNode.removeChild(veil); },
                   RM ? 200 : 900);
      }, RM ? 130 : 620);
    /* 28 Aug (pass142): was 4200ms, set when the confirmation was 20 words. It is
       now 48 — about eleven seconds of reading — so a four-second timer took the
       message off the screen before it could be finished, which is worse than not
       showing it. 9500ms is the read with a little air; the fade adds ~0.6s. Not
       longer than that: every dismissal path still works, and a screen that will
       not let you leave is its own kind of rude. */
    }, 9500);
  } else {
    /* outside the settle (focus mode off) fall back to the printed receipt */
    var mount = $('#receiptMount');
    mount.textContent = '';
    mount.appendChild(buildReceipt(c, who));
    $('#receiptBeat').style.display = '';
    observeAll($('#receiptBeat'));
    updateIdx();
    setTimeout(function(){
      $('#receiptBeat').scrollIntoView({ behavior: RM ? 'auto' : 'smooth', block:'start' });
    }, 120);
  }
}

/* measure the route wrap's real gutters so a grounded beat can reach both
   viewport edges — 100vw is wrong here, it counts the scrollbar */
function nfBleed(){
  /* measure a wrap that is actually laid out. A hidden route's wrap reports a
     zero rect, and feeding that in set --bleed-r to a full viewport width — the
     grounded beats came out twice as wide as the screen. Guarded, and retried on
     the next frame if nothing is measurable yet. */
  var w = $('.route.on > .wrap');
  if(!w || !w.getBoundingClientRect().width){
    w = $$('.wrap').filter(function(x){ return x.getBoundingClientRect().width > 0; })[0];
  }
  if(!w){ requestAnimationFrame(nfBleed); return; }
  var cs = getComputedStyle(w), r = w.getBoundingClientRect();
  if(!r.width) return;
  var vw = document.documentElement.clientWidth;   /* excludes the scrollbar */
  document.documentElement.style.setProperty('--bleed-l', Math.max(0, r.left + parseFloat(cs.paddingLeft)) + 'px');
  document.documentElement.style.setProperty('--bleed-r', Math.max(0, vw - r.right + parseFloat(cs.paddingRight)) + 'px');
}
nfBleed();
window.addEventListener('resize', nfBleed);

/* ── PER-ELEMENT BLEED · [data-bleed] ──────────────────────────────────────
   --bleed-l/--bleed-r above are measured off the ROUTE WRAP. That is right for a
   child of .wrap and wrong for anything nested deeper: .icb sits in a .beat padded
   66/44 while the wrap is 70, so the shared vars overshot it by 10px left and 6px
   right — invisible, because .beat clips, which is exactly why it needed measuring
   rather than looking at.
   Anything marked data-bleed gets --bl/--br from ITS OWN parent's real padding, so a
   negative margin of that size reaches the viewport edge from wherever it sits.
   (.icb still carries its own copy of this from earlier today; folding it in here is
   a tidy-up worth doing, not a fix — its numbers are correct.) */
function nfBleedEls(){
  [].forEach.call(document.querySelectorAll('[data-bleed]'), function(el){
    var par = el.parentElement; if(!par) return;
    var cs = getComputedStyle(par);
    el.style.setProperty('--bl', cs.paddingLeft);
    el.style.setProperty('--br', cs.paddingRight);
  });
}
nfBleedEls();
window.addEventListener('resize', nfBleedEls);

/* ── THE ICEBERG FILL · [data-fill] ────────────────────────────────────────
   23 Aug. Alex sent icebergdoc.org: the statement sits ghosted on the ground and the
   words ink in as the block travels up the viewport, with two or three mid-fade at the
   leading edge so it reads as a sweep rather than a switch.

   Built per WORD, not per character and not as a background-clip gradient. Two reasons.
   A gradient mask over text kills the per-span colours this statement depends on —
   the orange hinge and the green outcome are the whole point of the block. And words
   are the unit the eye reads in, so a word-level sweep tracks how the sentence is
   actually taken in; per-character just costs three times the nodes to look the same.

   NOTHING IS HIDDEN UNLESS THE SCRIPT IS RUNNING. The ghost opacity lives on
   .fill-on, which only JS adds — so with JS off, blocked, or errored the statement is
   simply fully visible. The one failure mode that matters here is copy that never
   arrives, and this cannot produce it. prefers-reduced-motion opts out the same way.

   The split walks TEXT NODES, so <em> and the coloured spans survive intact — wrapping
   innerHTML would have flattened them. */
(function(){
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  var blocks = [].slice.call(document.querySelectorAll('[data-fill]'));

   geo-IP service, and it is accurate enough for choosing which desk answers.
   Everything after first load follows the toggle, so one click overrides it. */
/* 28 Aug (pass151) — which market a visitor opens on. Strongest signal first:
   an explicit ?mkt= in the URL, then the DOMAIN they typed, then their clock,
   then Singapore. See the note in tools/pass151.py for why the domain outranks
   the clock. Whatever this returns, the rail above overrides it on one click and
   nothing here ever runs again. */
function nfHomeMarket(){
  /* 1 · ?mkt=ae — an explicit instruction. Lets a campaign link, or a quote we
         email out, open in the right currency for whoever opens it. */
  try{
    var q = /[?&]mkt=([a-z]{2})/i.exec(location.search || '');
    if(q){
      var want = q[1].toUpperCase();
      if(want === 'UAE') want = 'AE';
      if(want === 'GB')  want = 'UK';
      if(want === 'AE' || want === 'SG' || want === 'UK') return want;
    }
  }catch(e){}

  /* 2 · the domain. Alex, 28 Aug: "if a user ... types in nofilter.ae, the
         pricing is auto set to UAE ... i.e. they select nofilter.sg." Typing the
         address IS the choice, so it beats an inferred location. Matched on the
         TLD with a boundary, not with indexOf — 'nofilter-shared.netlify.app'
         and any future 'ae-something' host must not read as the UAE. */
  try{
    var host = (location.hostname || '').toLowerCase().replace(/\.$/, '');
    if(/(^|\.)nofilter\.ae$/.test(host) || /\.ae$/.test(host)) return 'AE';
    if(/(^|\.)nofilter\.sg$/.test(host) || /\.sg$/.test(host)) return 'SG';
    if(/\.uk$/.test(host)) return 'UK';
  }catch(e){}

  /* 3 · the clock — unchanged, and still the only signal for a reader who
         arrives on a netlify preview or a shared build. */
  try{
    var tz=(Intl.DateTimeFormat().resolvedOptions().timeZone||'');
    if(/^Asia\/(Dubai|Muscat|Qatar|Riyadh|Bahrain|Kuwait)$/.test(tz)) return 'AE';
    if(/^Europe\/(London|Belfast|Guernsey|Isle_of_Man|Jersey)$/.test(tz)) return 'UK';
  }catch(e){}

  return 'SG';
}
/* ══════════════════════════════════════════════════════════════════════════
   AT WORK · THE ESTIMATOR
   ══════════════════════════════════════════════════════════════════════════
   Alex, 20 Aug: "feel this section is incredibly weak, what's your take?"

   The take was that the section led with OUR number. The side column says it
   outright — "updated per cup poured across all NoFilter floors" — so the hero
   figure belonged to somebody else, and the same tally was already running in the
   rail on every route. It gave an office manager nothing to hold.

   So the counter now answers one question: what does MY floor hold? Headcount in,
   forest out. Every step below is derived from a constant this build already owns
   or from the market the visitor is on — nothing is invented:

     cups/day     headcount x CUPS_HEAD_DAY
     kg/year      cups / cupsPerKg, where DOSE = 18 g is the same dose the quote
                  builder uses for its cents-per-cup ladder (line ~9203)
     to forest    kg x list price x the band rate already published as
                  window.__nfBandRate — so it moves with the SG/UAE toggle
     m²/year      cups x M2_PER_CUP

   M2_PER_CUP IS THE ONE PLACEHOLDER. There is no cost-per-m² anywhere in this
   build to derive it from, and I am not going to invent a conservation figure and
   let it read as fact. It is declared once, flagged on the page, and listed in the
   header note with the other seeded series. Replace this single number and the
   whole instrument becomes real. */
var nfEstTouched = false;   /* true only after the reader moves the headcount control */
var CUPS_HEAD_DAY = 2;      /* office planning assumption, stated on the page */
var WORK_DAYS     = 240;    /* ditto */
var EST_DOSE_G    = 18;     /* the build's own dose — quote builder, var DOSE=18 */
/* M2_PER_CUP (0.42) IS GONE. It was the last placeholder in this instrument and
   it existed only to convert cups into square metres of "forest held" — the
   claim Alex retired on 21 Aug. Every figure below is now derived from numbers
   this build already states on the page: the dose, the working year, the
   market's list price per kilo, and the contribution band. Nothing here needs
   a number we do not have. */

function nfEstimate(){
  var head = $('#estHead');
  if(!head) return;
  var n     = parseInt(head.value,10) || 0;
  var cupsD = n * CUPS_HEAD_DAY;
  var cupsY = cupsD * WORK_DAYS;
  var kgY   = cupsY * EST_DOSE_G / 1000;
  var price = MKT.kg.def;
  var rate  = (window.__nfBandRate ? window.__nfBandRate(price) : 0.10);
  var giveY = kgY * price * rate;
  var perCup = cupsY ? (giveY / cupsY) : 0;

  var out = $('#estHeadOut'); if(out) out.textContent = n;
  /* the split-flap now shows the money, which is the whole point of the change */
  if(flapWall) flapSet(flapWall, Math.round(giveY).toLocaleString('en-SG'));
  var u=$('#estCur'); if(u) u.textContent = MKT.cur;
  var c=$('#estCups'), k=$('#estKg'), g=$('#estGive');
  if(c) c.textContent = cupsD.toLocaleString('en-SG');
  /* the cup framing Alex asked for, derived rather than asked for as an input */
  var cm=$('#estCupsMo'); if(cm) cm.textContent = Math.round(cupsY/12).toLocaleString('en-SG');
  if(k) k.textContent = Math.round(kgY).toLocaleString('en-SG') + ' kg';
  /* per-cup is the crux figure — same chain, divided back down to one cup */
  if(g) g.textContent = MKT.cur + ' ' + perCup.toFixed(3);
  var band=$('#estBand'); if(band) band.textContent = window.__nfPct(rate) + '%';
  /* the price the rate was read off — an assumption line that hides one of its
     own assumptions is not doing its job. Follows the market toggle. */
  var pe=$('#estPrice'); if(pe) pe.textContent = MKT.cur + ' ' + price.toFixed(2);
  /* push the reader's own number up into the hero odometer — but ONLY once the
     reader has actually moved the control. nfEstimate() also runs once at boot
     to paint the default state, and on that pass the hero must stay on the
     site-wide figure: a page that opens already showing "your floor, per year"
     before anyone has told it a headcount is asserting something about the
     reader that it does not know. */
  if(nfEstTouched && window.__nfAwxFloor) window.__nfAwxFloor(giveY, n);
  /* and to the crux statement, which quotes the per-cup figure */
  var cx=$('#cxFig'); if(cx) cx.textContent = perCup.toFixed(3);
  var cxc=$('#cxCur'); if(cxc) cxc.textContent = MKT.cur;
}
(function(){
  var head = $('#estHead');
  if(!head) return;
  function nfEstInput(){ nfEstTouched = true; nfEstimate(); }
  head.addEventListener('input', nfEstInput);
  head.addEventListener('change', nfEstInput);
})();

applyMarket(nfHomeMarket());
nfEstimate();
observeAll(document);
armVideos();
window.addEventListener('hashchange', function(){ requestAnimationFrame(nfBleed); });
ambient();
fromHash();
window.addEventListener('keydown', function(e){ if(e.key === 'Escape') openCart(false); });
})();

</script>

<script>

/* ══ STEP 3 · the unified instrument, verbatim from the Eastspring build ══ */

/* unified instrument: drives the hidden native sliders; the morph stays the nervous system */
(function(){
  function init(){
    var wrap=document.getElementById('uniWrap'); if(!wrap) return;
    var stage=document.getElementById('morphStage'),
        pS=document.getElementById('wholePrice'), tS=document.getElementById('topUp'),
        thumb=document.getElementById('uniThumb'), pin=document.getElementById('uniPin'), pinlab=document.getElementById('uniPinLab'),
        fillP=document.getElementById('uniFillP'), fillT=document.getElementById('uniFillT'), zone=document.getElementById('uniZone'),
        labL=document.getElementById('uniLabL'), labR=document.getElementById('uniLabR'),
        mk=document.getElementById('uniMk'), mkl=document.getElementById('uniMkLab'),
        mk2=document.getElementById('uniMk2'), mkl2=document.getElementById('uniMkLab2'),
        mk3=document.getElementById('uniMk3'), mkl3=document.getElementById('uniMkLab3'),
        hint=document.getElementById('uniHint');
    if(!stage||!pS||!tS) return;
    var PMIN=+pS.min, PMAX=+pS.max, PSTEP=+pS.step||0.25, TMAX=+tS.max, TSTEP=+tS.step||0.1;
    var UNI_MODE='reset';                      // 'reset': lock recolours + thumb restarts at zero, full track = top-up. 'pin': boundary-pin model.
    var PIN_FRAC = UNI_MODE==='reset' ? 0 : 0.40;
    var dragging=false;
    function locked(){ return stage.classList.contains('ph-topup'); }
    function price(){ return +pS.value; }
    function topup(){ return +tS.value; }
    function W(){ return wrap.clientWidth; }
    function setNative(el,v){ el.value=v; el.dispatchEvent(new Event('input',{bubbles:true})); }
    function render(){
      var w=W(); if(w<40){ __nfRelayout(wrap, render); return; }   /* pass104 */
      /* re-read the market's range each frame — these were captured once at
         init, so a market switch left the dial mapping the old band (see
         pass61). Cheap: three attribute reads. */
      PMIN=+pS.min; PMAX=+pS.max; PSTEP=+pS.step||PSTEP;
      TMAX=+tS.max||TMAX; TSTEP=+tS.step||TSTEP;   /* block 76 — same reason, for the top-up */
      if(!locked()){
        var x=((price()-PMIN)/(PMAX-PMIN))*w;
        thumb.style.left=x+'px';
        fillP.style.width=x+'px';
        fillT.style.left=x+'px'; fillT.style.width='0px';
        zone.style.left=x+'px'; zone.style.width=(w-x)+'px';
        var CURW=(window.__nfCur||'SGD')+' ';       /* was hardcoded 'SGD ' */
        labR.style.left=w+'px'; labR.textContent=CURW+PMAX;
        labL.textContent=CURW+PMIN;
        /* both rungs, at THIS market's band points (ES marked its single 49) */
        var BM = window.__nfBandMarks || { mid:PMIN+(PMAX-PMIN)*0.30, full:PMIN+(PMAX-PMIN)*0.60 };
        var mFull=((BM.full-PMIN)/(PMAX-PMIN))*w, mMid=((BM.mid-PMIN)/(PMAX-PMIN))*w;
        mk.style.left=mFull+'px'; mkl.style.left=mFull+'px';
        mk.style.opacity=1; mkl.style.opacity=1;
        if(mk2){ mk2.style.left=mMid+'px'; mkl2.style.left=mMid+'px';
                 mk2.style.opacity=1; mkl2.style.opacity=1; }
        if(mk3){ var mBase=(((BM.base!=null?BM.base:PMIN)-PMIN)/(PMAX-PMIN))*w;
                 mk3.style.left=mBase+'px'; mkl3.style.left=mBase+'px';
                 mk3.style.opacity=1; mkl3.style.opacity=1; }
      } else {
        var xp=PIN_FRAC*w, xt=xp+(topup()/TMAX)*(1-PIN_FRAC)*w;
        pin.style.left=xp+'px';
        pinlab.style.left=(UNI_MODE==='reset' ? Math.max(xp,70) : xp)+'px';
        pinlab.innerHTML='your price \u00b7 '+(window.__nfCur||'SGD')+' '+price().toFixed(2)+' \u00b7 <u>edit</u>';
        thumb.style.left=xt+'px';
        fillP.style.width=xp+'px';
        fillT.style.left=xp+'px'; fillT.style.width=(xt-xp)+'px';
        zone.style.left=xp+'px'; zone.style.width=(w-xp)+'px';
        labR.style.left=w+'px'; labR.textContent='+'+TMAX+window.__nfCup().sym+' / cup';

        if(mk2){ mk2.style.opacity=0; mkl2.style.opacity=0; }
        if(mk3){ mk3.style.opacity=0; mkl3.style.opacity=0; }

      guard();

    function storyBottom(){
      var fig=document.getElementById('morphFigure'); if(!fig) return 0;
      var sb=fig.getBoundingClientRect().bottom;
      var sub=document.getElementById('morphSub');
      if(sub){ var ss=getComputedStyle(sub); if(ss.display!=='none' && !sub.classList.contains('hide')) sb=Math.max(sb, sub.getBoundingClientRect().bottom); }
      var lk=document.getElementById('morphLocked');
      if(lk){ var lr=lk.getBoundingClientRect(); if(lr.height>2) sb=Math.max(sb, lr.bottom); }
      return sb;
    }
    function guard(){
      var vol=document.getElementById('mCtlVol');
      var ctl=(vol && getComputedStyle(vol).display!=='none') ? vol : document.getElementById('mCtlUni');
      if(!ctl || !document.getElementById('morphFigure')) return;
      stage.classList.remove('m-compact'); stage.classList.remove('m-compact2');
      if(storyBottom() + 34 > ctl.getBoundingClientRect().top){
        stage.classList.add('m-compact');
        if(storyBottom() + 34 > ctl.getBoundingClientRect().top) stage.classList.add('m-compact2');
      }
    }
    function setFromClientX(cx){
      var r=wrap.getBoundingClientRect(), x=cx-r.left, w=W();
      if(!locked()){
        var p=PMIN+(x/w)*(PMAX-PMIN);
        p=Math.round(Math.min(PMAX,Math.max(PMIN,p))/PSTEP)*PSTEP;
        setNative(pS,p.toFixed(2));
      } else {
        if(x < PIN_FRAC*w-6){
          thumb.classList.remove('deny'); void thumb.offsetWidth; thumb.classList.add('deny');
          hint.classList.add('on'); clearTimeout(hint.__t); hint.__t=setTimeout(function(){hint.classList.remove('on');},1400);
          setNative(tS,0);

          var t=((x-PIN_FRAC*w)/((1-PIN_FRAC)*w))*TMAX;
          t=Math.round(Math.min(TMAX,Math.max(0,t))/TSTEP)*TSTEP;
          setNative(tS,t.toFixed(1));

    }
    function onDown(e){ dragging=true; thumb.classList.remove('thumb-pulse-u'); setFromClientX(e.touches?e.touches[0].clientX:e.clientX); e.preventDefault(); }
    function onMove(e){ if(dragging) setFromClientX(e.touches?e.touches[0].clientX:e.clientX); }
    function onUp(){ dragging=false; }
    thumb.addEventListener('mousedown',onDown);
    document.getElementById('uniTrack').addEventListener('mousedown',onDown);
    document.addEventListener('mousemove',onMove); document.addEventListener('mouseup',onUp);
    thumb.addEventListener('touchstart',onDown,{passive:false});
    document.addEventListener('touchmove',onMove,{passive:false}); document.addEventListener('touchend',onUp);
    thumb.addEventListener('keydown',function(e){
      if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight') return;
      var d=(e.key==='ArrowRight')?1:-1;
      if(!locked()){ setNative(pS,Math.min(PMAX,Math.max(PMIN,price()+d*PSTEP)).toFixed(2)); }
      else { setNative(tS,Math.min(TMAX,Math.max(0,topup()+d*TSTEP)).toFixed(1)); }
      render(); e.preventDefault();
    });
    function unlock(){ if(window.__nfGoPhase){ setNative(tS,0); window.__nfGoPhase(0,true); } }
    pin.addEventListener('click',unlock); pinlab.addEventListener('click',unlock);
    // phase changes arrive as class flips on the stage; re-render and re-invite on lock
    var lastPhase='';
    new MutationObserver(function(){
      var cur=(stage.classList.contains('ph-topup')?'t':'')+(stage.classList.contains('year')?'y':'');
      if(cur===lastPhase) return;   // ignore the guard's own compaction classes: no feedback loop
      lastPhase=cur;
      render();
      if(locked()){ thumb.classList.add('thumb-pulse-u'); clearTimeout(thumb.__pt); thumb.__pt=setTimeout(function(){ thumb.classList.remove('thumb-pulse-u'); },3600); }
    }).observe(stage,{attributes:true,attributeFilter:['class']});
    if('ResizeObserver' in window) new ResizeObserver(render).observe(wrap);
    window.addEventListener('resize',render);
    window.__nfUniRender = render;   /* block 76 — the market switch calls this */
    render();
    if(document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ render(); });
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',function(){ setTimeout(init,0); });
  else setTimeout(init,0);
})();


</script>

<script>

/* ══ STEP 3 · the morph controller, verbatim (319 lines), plus the two shims
   its contract needs: the id helper it was written against, and a compute()
   that answers with THIS visitor's numbers rather than Eastspring's. ══════ */
(function(){
  'use strict';
  function $(id){ return document.getElementById(id); }
  if(!$('morphStage')) return;

  var DOSE_G = 18;                       /* the dose every NoFilter figure derives from */

  /* the contract: {price, topUp, vol, rate, baseCents, combined, annual} */
  function compute(){
    var pS = $('wholePrice'), tS = $('topUp'), vS = $('volCups');
    var price = pS ? +pS.value : 48;
    var topUp = tS ? +tS.value : 0;
    var vol   = vS ? +vS.value : 43000;
    var rate  = (window.__nfBandRate ? window.__nfBandRate(price) : 0.10);
    var baseCents = price * rate * (DOSE_G/1000) * 100;
    var combined  = baseCents + topUp;
    var annual    = vol * combined / 100;
    /* the price dial is this build's price per kg — keep the console in step */
    if(window.__nfSetPrice) window.__nfSetPrice(price);
    return { price:price, topUp:topUp, vol:vol, rate:rate,
             baseCents:baseCents, combined:combined, annual:annual };
  }
  /* ══ THE CELEBRATION BURST · verbatim from NoFilter-Eastspring-Part2.html ══
     An earlier note here read "that build's confetti engine ... is not ported"
     and stubbed the function to a no-op — which is why crossing 7.5% and 10%
     did nothing. Ported 25 Aug: same palette, same leaf/bean particles, same
     fan maths, same 44/30 particle counts by tier. The tier-crossing caller in
     the morph controller already existed and was firing into the stub. */
  var NF_PAL = ['#ed3326','#F4F2EE','#16a34a','#e89a3a','#1f5132'];
  function nfLeafSVG(c){
    return '<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">'+
      '<path d="M12 2C7 4 3 8 3 14c0 5 4 8 9 8 0-6 2-10 6-13-4 .5-7 2-9 5 .5-5 2-9 3-12z" fill="'+c+'"/></svg>';
  }
  function nfBeanSVG(c){
    return '<svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true">'+
      '<ellipse cx="12" cy="12" rx="6.5" ry="9.5" fill="'+c+'"/>'+
      '<path d="M12 3c-2 4-2 14 0 18" stroke="rgba(0,0,0,.35)" stroke-width="1.4" fill="none"/></svg>';
  }
  function nfCelebrateAt(slider, tier){
    if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var ox, oy;
    if(slider && (slider.min===undefined || slider.min==='')){

      var TH=24;
      ox = sBox.left + TH/2 + frac*(sBox.width - TH); oy = sBox.top - 6;
    } else { ox = window.innerWidth*0.5; oy = window.innerHeight*0.35; }

      p.innerHTML = (Math.random()<0.55 ? nfLeafSVG(col) : nfBeanSVG(col));
      var ang  = (-90 + (Math.random()*150-75)) * Math.PI/180;
      var dist = 90 + Math.random()*170;
      var dx = Math.cos(ang)*dist;
      var dy = Math.sin(ang)*dist + (40+Math.random()*60);
      var rot = (Math.random()*720-360)|0;
      var d   = dur*(0.7+Math.random()*0.5);
      p.style.left = (ox + (Math.random()*20-10)) + 'px';
      p.style.top  = (oy + (Math.random()*10-5)) + 'px';
      p.style.setProperty('--dx', dx.toFixed(0)+'px');
      p.style.setProperty('--dy', dy.toFixed(0)+'px');
      p.style.setProperty('--rot', rot+'deg');
      p.style.animation = 'nfFloat '+d.toFixed(0)+'ms cubic-bezier(.2,.7,.3,1) forwards';
      layer.appendChild(p);
    }
    setTimeout(function(){ if(layer.parentNode) layer.parentNode.removeChild(layer); }, dur+400);
  }
  window.nfCelebrateAt = nfCelebrateAt;

  (function(){
    var stage=$('morphStage'); if(!stage) return;
    var DOSE=18, cupsPerKg=1000/DOSE;
    var pSlider=$('wholePrice'), tuSlider=$('topUp'), volSlider=$('volCups');

    /* ── price hover boxes: appear on cursor-over the slider, explain what it sets. ── */
    (function(){
      var track=$('uniWrap') || $('mPriceTrack'); if(!track) return;

      }
      var gl=mk('l','Why you set the price','<p>The price is yours to set, because no two sites carry the same budget and budgets shift year to year. Whatever you land on does three jobs at once: it pays the farmers at the forest edge, funds the NGOs holding the line, and keeps our lights on so the work carries on.</p><p>The dial is simply here to show what each price would do.</p>');
      /* block 76 — the right card is a template over the market's bands */
      function __whereItGoes(){
        var M = window.__nfMkt ? window.__nfMkt() : null;

        var cup = function(b){ return (b.from*b.rate/(1000/18)*100).toFixed(1); };

      }
      var gr=mk('r','Where it goes',__whereItGoes());
      window.__nfRefreshPriceGutter = function(){ gr.innerHTML='<p class="mgut-eyebrow">Where it goes</p>'+__whereItGoes(); };
      var GAP=60;
      function placeGutters(){
        var r=track.getBoundingClientRect();

             the scroll." No clamp, no clip: the card is as tall as its copy.

             decision, and does nothing else about it. */
          var sr=sg.getBoundingClientRect();
          gl.style.maxHeight=''; gr.style.maxHeight='';
          gl.dataset.over=Math.max(0,Math.round(anchorTop+gl.offsetHeight-(sr.bottom-24)));
          gr.dataset.over=Math.max(0,Math.round(anchorTop+gr.offsetHeight-(sr.bottom-24)));
          /* block 81 — a card that would pass the foot rises to sit inside it */
          gl.__top=Math.max(sr.top+24, Math.min(anchorTop, sr.bottom-24-gl.offsetHeight));
          gr.__top=Math.max(sr.top+24, Math.min(anchorTop, sr.bottom-24-gr.offsetHeight)); })();   /* block 76 */
        gl.style.top=(gl.__top!=null?gl.__top:anchorTop)+'px';
        gr.style.top=(gr.__top!=null?gr.__top:anchorTop)+'px';
        return true;
      }
      var on=false;
      function show(){ if(stg && stg.classList.contains('ph-topup')) return; if(placeGutters()){ on=true; gl.classList.add('is-on'); gr.classList.add('is-on'); } }
      function hide(){ on=false; gl.classList.remove('is-on'); gr.classList.remove('is-on'); }
      window.__nfPriceGutters={show:show,hide:hide};
      setTimeout(show, 400);   /* block 76 — on first load, before any phase change */
      (function(){
        var wrap=document.getElementById('nfConsoleWrap'); if(!wrap || !window.MutationObserver) return;

        }

      })();

      track.addEventListener('focusin',show);

    })();

    /* ── top-up hover boxes: same mechanism, bound to the top-up slider ── */
    (function(){

      var stg=$('morphStage');
      function mk(side,eyebrow,body){

      paint(animate);
      // one forward control per state: the deck Next appears only once the builder is complete
      /* block 76 — the corner "Your quote →" yields to the in-card button on
         the year phase; #deckNext0 never existed, so the old line did nothing */
      (function(){ var dn=document.querySelector('.deck-screen.is-active .deck-next'); if(dn) dn.style.visibility = (p===2) ? 'hidden' : ''; })();
      // top-up explainers are hover/focus-only again (the equation line explains the number); ensure they retire on phase change
      /* block 76 — each phase shows its own pair and retires the others. The
         timeout is one tick so the phase class and the control the cards are
         measured against are in place first. */
      if(window.__nfPriceGutters){ if(p===0) setTimeout(window.__nfPriceGutters.show,80); else window.__nfPriceGutters.hide(); }
      if(window.__nfTopupGutters){ if(p===1) setTimeout(window.__nfTopupGutters.show,80); else window.__nfTopupGutters.hide(); }
      if(window.__nfYearGutters){  if(p===2) setTimeout(window.__nfYearGutters.show,80);  else window.__nfYearGutters.hide(); }
      var rid=(function(){ var n=document.getElementById('qStepName'); return n&&n.parentElement ? n.parentElement.querySelector('.q-head-copy') : null; })();
      if(rid) rid.classList.toggle('rider-off', p!==0);
    }
    window.__nfGoPhase=goPhase;
    /* 28 Aug (pass144): a slider that is display:none has clientWidth 0, so its
       fill cannot be positioned until it is shown. A ResizeObserver is the honest
       trigger — going from none to flex IS a resize — and it covers the phase
       change, a window resize and a late font landing without any of them having
       to know this exists. paint(false) re-runs the same maths as a drag. */
    if(window.ResizeObserver){
      var _fitRO = new ResizeObserver(function(){ paint(false); });
      [pSlider, tuSlider, volSlider].forEach(function(s){ if(s) _fitRO.observe(s); });
    }
    // repaint morph whenever the shared sliders move (compute() already wired separately)
    pSlider.addEventListener('input',function(){ if(!window.__nfMorphSync) mPrimed=true; paint(false);   /* pass129 */
      pSlider.classList.remove('thumb-pulse');
      if(figure){ figure.classList.remove('mbump'); void figure.offsetWidth; figure.classList.add('mbump'); } });
    if(tuSlider) tuSlider.addEventListener('input',function(){ if(!window.__nfMorphSync) mPrimed=true; tuSlider.classList.remove('thumb-pulse'); paint(false); });   /* pass129 */
    if(volSlider) volSlider.addEventListener('input',function(){ volSlider.classList.remove('thumb-pulse'); paint(false);
      if(window.__nfRecalc) window.__nfRecalc();                       /* block 109 */ });   /* block 75: retire the pulse on first touch, as the other two do */

    lockBtn.addEventListener('click',function(){
      if(phase===0){ goPhase(1); }
      else if(phase===1){ goPhase(2); }
      /* block 75 — same destination as the corner "Your quote →", through
         that button's own click so its gating and scroll handling apply */
      else if(phase===2){ var q=document.querySelector('.deck-screen.is-active .deck-next'); if(q) q.click(); }
    });
    backLink.addEventListener('click',function(){ goPhase(Math.max(0,phase-1)); });

    // progress rail: click any already-visited step to jump back to it
    document.querySelectorAll('.morph-rail .seg').forEach(function(seg){
      seg.addEventListener('click',function(){
        var target=+seg.dataset.seg;
        if(target<=maxPhase) goPhase(target);   // only to visited steps (backward or current)
      });
    });

    paint(false);
    // reopen path: the wizard returns to its first sub-step
    window.__morphReset=function(){ try{ goPhase(0); }catch(e){} };
  })();
})();

</script>
