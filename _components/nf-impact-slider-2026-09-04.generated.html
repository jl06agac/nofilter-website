:root{
  /* 28 Aug (pass153) — this build's signature. Custom properties survive
     minification unrenamed and travel with any copy of this stylesheet, so
     reading --nf-bld on somebody else's domain is proof rather than argument.
     It does not prevent copying; it makes copying answerable. */
  --nf-bld:'nf-2026-08-28';
  --ink:#07080A;
  --panel:#0D1012;
  --panel2:#12161A;
  --panel3:#171C20;
  --line:#242A2F;
  --line2:#333B41;
  --cream:#F4F2EE;
  --mute:#96A0A7;
  /* AUDIT, 21 Aug — measured, not guessed. --dim was #5E686F and --dimmer
     #3A4248, giving 3.52:1 and 1.96:1 against the #07080A instrument ground.
     Every label using them is 9–11px, where WCAG AA wants 4.5:1. 1.96:1 is not
     a dim aesthetic, it is invisible: "NO LINES. CART EMPTY." and the vertical
     rail label were unreadable on a good monitor, never mind a bright room.
     --dim carries real labels and now passes at 5.05:1. --dimmer carries only
     decorative rail marks and is lifted to 3.11:1 rather than to AA, because
     taking it further flattens the depth the instrument look depends on. */
  --dim:#78838B;
  --dimmer:#59636A;
  --signal:#EE4D17;  /* was #ED3326, a red. Alex, 21 Aug: the brochure build
     (NF-Brochure/deploy/index.html) ran #EE4D17 — a genuinely orange orange —
     alongside the Arakan footage, and that is the site he remembers. It also
     measures better on every dark ground here: 4.87 -> 5.45 on the void, and
     3.57 -> 4.00 on the new forest green. Worse on cream (3.40 -> 3.04), which
     changes nothing in practice: small type on the paper grounds already uses
     the ink-side #C82418 at 4.66 for exactly that reason. And it matches the
     wordmark, which was orange all along. One token, 112 call sites. */
  --signal-dim:#8C2E0D;  /* re-derived from #EE4D17, same relationship */
  --paper:#EDE9E0;
  --rail-h:104px;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --disp:'Big Shoulders Display','Archivo Black',Impact,sans-serif;
  --body:'Archivo',system-ui,-apple-system,'Helvetica Neue',sans-serif;
  --ease:cubic-bezier(.22,.61,.36,1);
  --gut:clamp(16px,3.2vw,44px);
}
html{-webkit-text-size-adjust:100%;
  /* clip, not hidden, 25 Aug: the partner band bleeds with calc(50% - 50vw), whose
     100vw includes the scrollbar - ~11px of phantom hscroll. clip discards it without
     creating a scroll container, so sticky and the covers are untouched. */
  overflow-x:clip}
body{
  margin:0;background:var(--ink);color:var(--cream);
  font-family:var(--body);font-size:16px;line-height:1.5;
  font-variant-numeric:tabular-nums;font-feature-settings:'tnum' 1,'ss01' 1;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;

/* ══════════════════════════════════════════════════════════════════════════
   STEP 3 · THE MORPH INSTRUMENT — ported, not reskinned
   ══════════════════════════════════════════════════════════════════════════
   Alex, 19 Aug 2026: "even the price and share is a shell, not a port. i won't
   tolerate non faithful shells, port exactly then we'll amend."

   So this is the actual instrument from NoFilter-Eastspring-Part2.html, not a
   slider dressed up as one: the three-phase rail (Price → Top-up → The year),
   the morphing headline figure, the unified track with its pin, zone, fills and
   thumb, the hover gutters that explain what the dial does, the lock-to-advance
   button and the milestone glow. 196 CSS rules and both controllers — the
   unified-instrument driver and the 319-line morph controller — taken as
   written.

   THE ONE CONTRACT I HAD TO SATISFY: that controller calls a compute() which
   returns{price, topUp, vol, rate, baseCents, combined, annual}
. Eastspring's
   compute() is welded to their deal — their 42–52 band, their flat 5%, their
   43,000 cups. Ours is supplied below from Option D's model instead, using the
   same arithmetic their build documents: cents/cup = price × rate × 18/1000 ×
   100, the 18g dose, combined = base + top-up, annual = cups × combined ÷ 100.
   The instrument is theirs; the numbers are this visitor's. That is the amend
   step he asked for, and it is the only one taken.

  /* thumb-travel correction: thumb border-box is 30px (24 + 2×3 border), so at fraction f the
     thumb CENTER sits at f·(100% − 30px) + 15px, not f·100%.
     The range is 42–52, so SGD 46 is f=0.4 → 40% − 12px + 15px = 40% + 3px.
     (It was left at 33.333% + 5px, the answer for the old 44–50 range — which put the

.nf-console-wrap .cx-photo .cx-details:focus-visible{outline:2px solid var(--or,#ed3326);outline-offset:-2px;}

.nf-console-wrap .cx-tile.is-active .cx-photo .cx-details{transform:translateX(0);background:var(--or,#ed3326);}

<!-- markup: #morphStage -->
<div class="morph-stage" id="morphStage">
    <div class="morph-bg">
      <figure><video muted loop playsinline preload="metadata" onerror="var f=this.closest('.morph-bg').querySelector('.mfb');if(f)f.style.display='flex';this.style.display='none';"><source data-src="../../_CDN-UPLOAD-SAFE/signoff-orangutan-lite.mp4" type="video/mp4"></video><div class="mfb" style="display:none;">orangutan footage</div></figure>
    </div>
    <div class="morph-scrim"></div>
    

    <div class="morph-rail" id="morphRail">
      <div class="seg active" data-seg="0"><span class="rdot">1</span><span class="rname">Price</span></div>
      <div class="rline" id="mrl0"></div>
      <div class="seg" data-seg="1"><span class="rdot">2</span><span class="rname">Top-up</span></div>
      <div class="rline" id="mrl1"></div>
      <div class="seg" data-seg="2"><span class="rdot">3</span><span class="rname">The year</span></div>
    </div>

    <div class="morph-inner">
      <div class="morph-eyebrow" id="morphEyebrow"></div>
      <div class="morph-figure" id="morphFigure"><span class="mfig-lead" id="mFigLead"></span><span class="mcur" id="mFigCur">SGD </span><span class="mnum" id="mFigNum">42.00</span><span class="mu" id="mFigUnit"></span><span class="mper" id="mFigPer">/kg</span><span class="mfig-eq" id="mFigEq">=</span><span class="mfig-imp"><span class="mnum mnum-imp" id="mFigNum2">3.8</span><span class="mu mu-imp">¢</span><span class="mper" >/cup</span></span></div>
      <div class="morph-sub hide" id="morphSub"></div>
      <div class="morph-cap" id="morphCap">the price you set, per kilo roasted and landed</div>

      <div class="morph-locked" id="morphLocked"></div>

      <!-- phase 0: price only (real ID wholePrice) -->
      <div class="morph-ctl" id="mCtlPrice">
        <div class="mrow mrow-price">
          <div class="mprice-track" id="mPriceTrack">
            <span class="mprice-band" aria-hidden="true"></span>
            <span class="mprice-band-lab">new accounts open here</span>
            <span class="mprice-mark mprice-mark--mid" id="mPriceMarkMid"><span class="mprice-mark-lab">7.5%</span></span>
            <span class="mprice-mark mprice-mark--full" id="mPriceMark"><span class="mprice-mark-lab">full 10%</span></span>
            <input type="range" id="wholePrice" class="scale-range thumb-pulse" value="48.00" min="45" max="55" step="0.25">
          </div>
          <div class="morph-ends"><span id="mEndL">SGD 45</span><span id="mEndR">SGD 55</span></div>
        </div>
        <div class="mprice-encourage" id="mPriceEncourage"></div>
      </div>

      <!-- phase 1: optional top-up (real ID topUp), its own explained moment -->
      <div class="morph-ctl hide" id="mCtlTopup">
        <div class="mrow">
          <div class="mrow-lab mrow-lab-opt">Your top-up<span id="mTopupEcho" class="mrow-echo"></span></div>
          <input type="range" id="topUp" class="scale-range topup-range thumb-pulse" value="0" min="0" max="7.5" step="0.1">
          <div class="morph-ends"><span>none</span><span>+7.5&cent; / cup</span></div>
        </div>
      </div>

      <!-- unified instrument: one track for price + top-up (drives the hidden native sliders) -->
      <div class="morph-ctl" id="mCtlUni">

          <div class="uni-track" id="uniTrack"></div>
          <div class="uni-zone" id="uniZone"></div>
          <div class="uni-fill-p" id="uniFillP"></div>
          <div class="uni-fill-t" id="uniFillT"></div>
          <!-- BOTH rungs are marked, 25 Aug: this build's rate STEPS (5 -> 7.5 at

          <div class="uni-mk" id="uniMk3"></div><div class="uni-mklab" id="uniMkLab3">5%</div>
          <div class="uni-pin" id="uniPin"></div><div class="uni-pinlab" id="uniPinLab"></div>
          <div class="uni-end" id="uniLabL">SGD 45</div>
          <div class="uni-end uni-end-r" id="uniLabR">SGD 55</div>
          <div class="uni-thumb thumb-pulse-u" id="uniThumb" role="slider" tabindex="0" aria-label="price and top-up"></div>
          <div class="uni-hint" id="uniHint">price locked · tap the pin to edit</div>

        <div class="morph-combined" id="morphCombined"></div>
      </div>

   (milk system every 30 days, descale 90, filter 120, burrs 180, annual
   preventive visit). That is maintenance, not warranty, and a machine we no
   longer own is not one we should be maintaining for free. */
function buyExtras(){ return (MKT && MKT.buyx) || MARKETS.SG.buyx; }
function svcYears(term){ return Math.round(term / 12); }

/* ── THE TWO THINGS A PURCHASE GETS FOR NOTHING ──────────────────────────
   31 Aug, Alex: "ideally they take them up and realise that there's a v slight
   discount even with all options added." These two rules are what produce that,
   and neither is a trick — both were already the commercial position:

   1. THE WRAP. Alex, 30 Aug: free against a 2-year coffee commitment, 1,000 with
      only a 1-year one. The builder offers 24- and 36-month terms and nothing
      shorter, so on every term it can quote, the wrap is free. The 1,000 and the
      400 removal stay on record for a 1-year deal quoted off-page.
   2. THE IMPACT COUNTER. It used to be rental-only, which made it a feature a
      buyer could never have. It is now 1,000 standing alone, and free to anyone
      taking both the cooler and the servicing plan — the configuration we want.

   Taken together with servicing held at 2,000/yr, a fully-optioned purchase lands
   1.2%–5.2% under the equivalent rental on seven of the eight lines. Easing
   servicing to 1,500 was the alternative and it does the opposite: the plan is the
   one charge that scales with the term, so cutting it blows the 36-month gap out
   to 7.5%–14.1%. Holding it tight is what keeps the discount slight. */
/* 31 Aug (10) — REWRITTEN AROUND THE PLAN, NOT THE TERM. Alex set the model:
   a purchase quotes YEAR ONE, and a two-year commitment carries the decal and
   the counter free. Both used to key off the rental term, which on a purchase
   is a number the buyer cannot see and does not choose.

   THE COMMERCIAL CASE, on Alex's own cost figures (decal 250-300, counter
   ~300, servicing 1,000/yr against 2,000 sold), per machine, extras only:

     1 yr, declines both     revenue 3,150   cost 1,950   gross 1,200
     1 yr, buys both         revenue 5,150   cost 2,600   gross 2,550
     2 yr, both free         revenue 5,150   cost 3,600   gross 1,550

   So the incentive is +350 against the buyer who would have declined a pair of
   1,000 add-ons — the likely case at that price — and -1,000 against the one
   who would have bought both anyway. It is a bet on attach rate, taken
   knowingly, and it buys a second year of relationship, our livery on their
   machine and the counter running the impact story on their floor. The
   giveaway itself costs 650 in real terms. */
/* THE COVER LADDER. Year one at svcYr1, every year after it at svcYr. One
   function, so the card, the quote sheet and any future document cannot price
   the same plan differently. */
/* ── 1 Sep 2026 · THE ONE-YEAR PLAN IS WITHDRAWN ─────────────────────────
   Alex: "twice annual coffee machine calibration should also be included
   regardless of plan selected." That one sentence deletes the one-year rung,
   and it is worth writing down why rather than just removing it.

   The one-year plan existed because, per RATE-CARD §3, "the manufacturer
   warranty still carries parts, so it buys two scheduled visits and nothing
   else." Two scheduled visits WAS the plan. Once calibration twice a year comes
   with every machine, a one-year plan at 1,250 is charging for something the
   buyer already has — and a client who works that out in a meeting has learned
   something about the whole card, not just this line.

   So cover now starts at two years, and the ladder is a real choice: take cover
   or don't. The floor loses 750 of gross on a rung that was never the point;
   what it buys is a card that does not have to be defended. */
/* the per-machine annual cover rate for the live market */
function coverRate(m){
  var c = (MKT && MKT.cover) || MARKETS.SG.cover;
  return (m && c && c[m.k]) || 0;
}
/* yrs is "covered to N years of ownership": 2 => one insured year (Y2),
   3 => two insured years (Y2 and Y3). Year one is never in here — it belongs to
   the warranty, and its optional servicing is buyx.svc1. */
/* ── 1 Sep 2026 · A PLAN COVERS FROM DAY ONE ──────────────────────────────
   Alex: "me selecting the cover to 24 months only adds the 2200 and not 2 years
   insurance servicing etc" — and, in the same breath, "the moment the 24 month
   coverage is selected the 'add year one servicing' option should disappear".

   Both say the same thing: "24 months coverage" has to mean MONTHS 1 TO 24. It
   meant months 13 to 24, because the risk-based build priced only the years
   NoFilter actually insures — which is correct arithmetic and the wrong product.
   A buyer reading "24 months coverage" beside 2,200 is being told they have two
   covered years; they have one, and the other is a separate toggle four rows
   down that they have to find and add themselves.

   So the plan is now the whole period: year-one servicing PLUS the insured
   years. The money is the straight sum of the two things it contains — nothing
   invented, and it still adds up in public:

       C6, 24 months = 750 (year-one servicing) + 2,200 (year 2 insured) = 2,950
       C6, 36 months = 750 + 2,200 + 2,200                               = 5,150

   Year one is still not INSURED by us — the manufacturer carries parts and
   labour, and the No-coverage column says so. What the plan adds in year one is
   the two maintenance visits, which is the only thing missing. */
function svcPlanCost(m, yrs){
  var y = Math.max(2, Math.min(3, yrs | 0));
  var x = buyExtras();
  /* block 78 — a market may price the wrap and counter the 3-year rung
     includes, rather than give them away below cost (UK: plan3Add) */
  return (x.svc1 || 0) + coverRate(m) * (y - 1) + ((y >= 3 && x.plan3Add) ? x.plan3Add : 0);
}
/* the old market-wide shape, kept only so a stale caller is obvious in test
   rather than silently quoting zero */
function svcPlanCostLegacy(x, yrs){
  var y = Math.max(2, Math.min(3, yrs | 0));
  /* the priced ladder, with the old progression kept as a fallback so a market
     that has not been given a svcPlan block still quotes something sane */
  if(x.svcPlan && x.svcPlan[y] != null) return x.svcPlan[y];
  return (x.svcYr1 || x.svcYr) + (y - 1) * x.svcYr;
}
/* 31 Aug (12) — THE TWO-YEAR GIVEAWAY IS WITHDRAWN, on the arithmetic rather
   than on taste. Against a buyer who takes the decal and the counter it cost
   1,250 of gross to save them 250; the only reason it ever looked sensible was
   an assumed 1,000 cost for year-one servicing that turned out to be 500.
   Priced properly, a one-year purchase already lands 8.6% under a 24-month
   rental with nothing given away — the modest gap we wanted, produced by the
   pricing instead of by a bribe. Both stay chargeable in every configuration. */
/* 31 Aug (14) — THE WRAP IS THE TWO-YEAR REWARD; THE COUNTER IS NOT.
   Alex: "livery wrap & impact counter - no option for FOC for Y2, where were
   we at on that?" Here is where, on the current costs (install 300, decal
   250-300, counter 300, plan 1,250 then 1,750, servicing cost 500 then 1,000):

     1 yr, buys both              client 12,350   gross 6,800
     1 yr, declines both          client 10,350   gross 5,400
     2 yr, BOTH free              client 12,100   gross 5,550   -1,250
     2 yr, WRAP free only         client 13,100   gross 6,550     -250

   Giving both away still costs 1,250 to save the buyer 250 — that has not
   changed and it stays withdrawn. Giving the WRAP alone costs 250 and reads
   as a real offer: they pay 750 more than a one-year deal and get a second
   year of cover plus a 1,000 wrap, so the step up is worth taking. Against
   the likelier one-year buyer who declines both it is +1,150.
   Note what this is NOT: two years is not cheaper than one. It is more cover
   for more money with the wrap thrown in, and the card says exactly that. */
/* 1 Sep — THE REWARD MOVES TO THE TOP RUNG ALONE. It sat at >= 2 when the
   two-year plan was 3,000; against a cover-to-24 plan of 2,000 it would be
   giving away 2,000 of hardware on a 2,000 sale, which is not a reward, it is
   the whole price. Both extras now attach to cover-to-36 only, and that is what
   keeps the inversion working: cover-to-24 WITH the extras bought is 13,100,
   cover-to-36 with them free is 12,700 — so 400 buys a second year of cover and
   the buyer is still ahead. */
function wrapCost(x, cfg){ return (cfg.svc && (cfg.svcYrs || 2) >= 3) ? 0 : x.wrap; }
/* ── 1 Sep 2026 · THE COUNTER IS FREE FROM TWO YEARS ──────────────────────
   This returned x.counter unconditionally, and the note above records why: on
   31 Aug the two-year giveaway of both extras was withdrawn because it cost
   1,250 of gross to save the buyer 250. That arithmetic was right and the
   conclusion was wrong, because it weighed only what the BUYER got for it.

   What changed is a fact I did not have: a rental or a purchase obliges the
   client to buy their beans from us — exclusive supply, no minimum volume, in
   contract. So the machine is the acquisition and the beans are the annuity.
   Against that, 1,000 of one-off gross is recovered in two to eight months of
   coffee on any plausible volume, and a third locked year is worth several
   times it.

   And the counter earns its keep twice. With exclusivity and no MOQ the
   exposure is not under-ordering, it is a machine quietly running someone
   else's bean — and the live counter is the only instrument that would show
   it: cups times ~8g against kilos actually ordered. Selling it to one-year
   buyers and withholding it from three-year ones had that exactly backwards.

   Wrap and counter now move together, so wrapCost above and this function
   answer the same question and must stay in step. */
function counterCost(x, cfg){ return (cfg.svc && (cfg.svcYrs || 2) >= 3) ? 0 : x.counter; }
/* ONE PURCHASE TOTAL, and everything that quotes one calls this.
   31 Aug — the quote sheet was calling svcPlanYr(), a function that does not
   exist anywhere in this file: every repaint of a purchase row on step 3 threw
   "svcPlanYr is not defined" and the row rendered NaN. It was written against
   an older, simpler model (base + a servicing year or two) and never updated
   when purchase gained its five configurable extras, so even had it existed it
   would have quoted a different number from the card.
   Two places computing one figure is how that happens; there is now one. */
/* 31 Aug (9) — A PURCHASE IS A TWO-YEAR COMMITMENT, AND THE TERM ROW GOES.
   Alex: "purchase should not show the 24-36 month buttons at all."
   He is right, and relabelling them 2yr/3yr this morning was a patch on a
   control that does not belong in this context at all — a buyer is not
   choosing a term, they are choosing how much cover to buy, and that choice
   belongs on the servicing row inside the panel, not on a segmented control
   that says "months" in the other mode.
   So the commitment is FIXED at 24 months on a purchase, which is also what
   makes his second ask work: wrapFreeFrom is already 24, so a two-year
   commitment is exactly what makes the livery wrap free, and the counter
   follows once the cooler and the plan are taken. The note writes itself
   because the model already said it.
   cfgm.term is deliberately NOT mutated — it stays whatever the reader chose
   for a rental, so flipping between the two modes does not quietly rewrite
   their rental term. Purchase simply never reads it. */
var BUY_TERM = 24;
function buyTotal(m, cfg){
  var x = buyExtras(), yrs = (cfg.svcYrs || 2);
  return m.buy + x.install
       + (cfg.cooler  ? x.cooler             : 0)
       /* a plan already contains year-one servicing (see svcPlanCost), so the
          standalone charge only applies when no plan is taken. Adding both was
          the first thing this refactor got wrong. */
       + (cfg.svc ? svcPlanCost(m, yrs) : (cfg.svc1 ? x.svc1 : 0))
       + (cfg.wrap    ? wrapCost(x, cfg)      : 0)
       + (cfg.counter ? counterCost(x, cfg)   : 0);
}

var BANDS = MKT.bands;
function bandFor(p){ for(var i=0;i<BANDS.length;i++){ if(p <= BANDS[i].to + 1e-9) return BANDS[i]; } return BANDS[2]; }

/* ── 1 · ROLLING DIGITS (mechanical flip / roll) ──────────────────────── */
function rollSet(el, str){
  el.setAttribute('role','img');
  el.setAttribute('aria-label', str);
  el.setAttribute('data-value', str);
  var pattern = str.replace(/\d/g,'#');
  if(el.getAttribute('data-p') !== pattern){
    el.setAttribute('data-p', pattern);
    el.textContent = '';
    for(var i=0;i<str.length;i++){
      var c = str.charAt(i), d = document.createElement('span');
      if(c >= '0' && c <= '9'){
        d.className = 'rd';
        var s = document.createElement('span'); s.className = 'rs';
        for(var n=0;n<10;n++){ var x = document.createElement('span'); x.textContent = String(n); s.appendChild(x); }
        d.appendChild(s);
      } else { d.className = 'rd w'; d.textContent = c; }
      el.appendChild(d);
    }
  }
  var slots = el.children, si = 0;
  for(var j=0;j<str.length;j++){
    var ch = str.charAt(j), slot = slots[j];
    if(!slot) break;
    if(ch >= '0' && ch <= '9'){
      var inner = slot.firstChild;
      if(inner) inner.style.transform = 'translateY(' + (-parseInt(ch,10)) + 'em)';
    }
    si++;
  }
}

/* ── 2 · SPLIT-FLAP ───────────────────────────────────────────────────── */
function flapSet(el, str){
  el.setAttribute('role','img');
  el.setAttribute('aria-label', str);
  el.setAttribute('data-value', str);
  var pattern = str.replace(/\d/g,'#');
  if(el.getAttribute('data-p') !== pattern){
    el.setAttribute('data-p', pattern);
    el.textContent = '';
    for(var i=0;i<str.length;i++){
      var c = str.charAt(i), d = document.createElement('span');
      d.className = (c >= '0' && c <= '9') ? 'fd' : 'fd sep';
      var f = document.createElement('b'); f.className = 'fc'; f.textContent = c;
      d.appendChild(f);
      el.appendChild(d);
    }
    return;
  }
  for(var j=0;j<str.length;j++){
    var slot = el.children[j]; if(!slot) break;
    var face = slot.firstChild, ch = str.charAt(j);
    if(face && face.textContent !== ch){
      if(RM){ face.textContent = ch; }
      else {
        /* 26 Aug (pass110): `void slot.offsetWidth` forced a synchronous layout
           purely to make the browser notice the class was removed before it was
           re-added — 618 forced layouts in Alex's trace, one per digit per flip.
           getAnimations() restarts the same CSS animation by addressing its
           timeline, which needs no flush at all. The reflow stays as the
           fallback where getAnimations is missing. */
        slot.classList.remove('flip');
        if(slot.getAnimations){
          slot.classList.add('flip');
          slot.getAnimations().forEach(function(a){ try{ a.currentTime = 0; a.play(); }catch(e){} });
        } else {
          void slot.offsetWidth;
          slot.classList.add('flip');
        }
        (function(f,v,s){
          setTimeout(function(){ f.textContent = v; }, 125);
          setTimeout(function(){ s.classList.remove('flip'); }, 300);
        })(face, ch, slot);
      }
    }
  }
}

/* ── 3 · TELEMETRY ────────────────────────────────────────────────────── */
/* Alex, 21 Aug: "we'll have to lose the m2 held statistics and change it to
   $ raised or some other defensible claim, our coffee does not hold forest,
   it's too much of a stretch."

   He is right and it is the most important call made on this build. "m² held"
   is an ATTRIBUTION claim — it asserts a causal link between a bag of coffee
   and a hectare of standing forest that cannot be substantiated even in
   principle, because the forest would have to be shown to have fallen without
   us. Money transferred is a different class of statement: it is a fact off
   NoFilter's own books, contractual at 10% of sale, and auditable. The counter
   treatment survives; only the quantity it counts has changed.

   ✔ NOT SEEDED. Alex, 21 Aug: "start at $13,312 so far" — SGD, cumulative
   contribution to conservation partners to date. This is the first figure on
   the counter that is a real business number rather than a modelling
   assumption, which is the whole reason the metric changed.

   THE COUNTER DOES NOT ACCRUE. Alex, same message: "hold static until we wire
   up a system that integrates with xero, invoice issuance or something." That
   is the right call and not merely a caution — a number ticking upward on
   screen is itself a claim about RATE, and we have no rate. The accrual
   machinery below is left intact and correct; setting RAISED_RATE_HR above
   zero is the only change needed once Xero can supply it, and raisedNow()
   will start moving again with no other edit.

   THE XERO HOOK: raisedNow() is the single read point. Everything downstream —
   the rail flap, the At Work hero odometer — already goes through it. Point it
   at a real endpoint (or have the build stamp RAISED_BASE at deploy) and both
   counters become live at once, still incapable of disagreeing. */
var RAISED_BASE = 13312;        /* ✔ REAL · cumulative SGD to conservation, stated by Alex 21 Aug 2026 */
var RAISED_RATE_HR = 0;         /* held at zero deliberately — see above. Not a placeholder. */
var T0 = Date.now();
var VERIFIED_AT = new Date(T0 - 227000); /* last independent satellite pass */

function raisedNow(){ return RAISED_BASE + Math.floor(((Date.now() - T0)/1000) * (RAISED_RATE_HR/3600)); }
var MONU = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
function utcStamp(d){
  return d.getUTCFullYear() + '-' + pad(d.getUTCMonth()+1) + '-' + pad(d.getUTCDate()) + ' ' +
         pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes()) + ':' + pad(d.getUTCSeconds()) + 'Z';
}
function utcShort(d){
  return pad(d.getUTCDate()) + ' ' + MONU[d.getUTCMonth()] + ' ' + pad(d.getUTCHours()) + ':' +
         pad(d.getUTCMinutes()) + ':' + pad(d.getUTCSeconds()) + 'Z';
}
var flapRail = $('#flapRail'), flapWall = $('#flapWall');
var posName = $('#posName'), posCoord = $('#posCoord');
var verStamp = $('#verStamp'), verAgo = $('#verAgo');
/* With no run-rate there is nothing per-hour to state. The slot carries a
   qualifier that cannot go stale instead of a date that would. Restore the
   rate line here when Xero is wired. */
$('#flapRate').textContent = RAISED_RATE_HR ? ('+' + RAISED_RATE_HR.toLocaleString('en-SG') + '/hr') : '\u00b7 to date';
verStamp.textContent = utcShort(VERIFIED_AT);
verStamp.setAttribute('title', utcStamp(VERIFIED_AT));

var posIdx = 0;
function cyclePos(){
  var o = ORIGINS[posIdx % ORIGINS.length];
  posName.textContent = o.name.toUpperCase();
  posCoord.textContent = o.coord;
  posIdx++;
}
cyclePos();

/* ── the rail's opening sweep ──────────────────────────────────────────────
   Alex, 21 Aug: "i think there's charm in seeing a counter start at a lower
   price but then tick up to its current figure."

   The At Work hero odometer already did this — it opens at zero and climbs.
   The rail flap did not; it snapped straight to the figure, so on every route
   except At Work the counter never appeared to do anything. It now runs the
   same easeOutCubic over the same 2600ms, so if you land on #work the rail and
   the hero climb together rather than one arriving before the other.

   The split-flap earns its keep here: flapSet() rebuilds its cells whenever
   the DIGIT COUNT changes, so the board physically grows 1 → 2 → 3 → 4 → 5
   cells on the way up rather than sitting at a fixed width padded with zeros.

   This is presentation, not accrual. It runs ONCE, on load, and settles on the
   real figure; it is not the counter ticking upward over time, which is the
   claim we do not have a rate for. When Xero is wired, the sweep stays and
   tick() resumes moving the number afterwards. */
var railIntroDone = false;
(function railIntro(){
  if(!flapRail) { railIntroDone = true; return; }
  var target = raisedNow(), t0 = null, DUR = 2600;
  function ease(t){ return 1 - Math.pow(1-t, 3); }
  function frame(now){
    if(t0 === null) t0 = now;
    var pr = Math.min(1, (now - t0) / DUR);
    var v = Math.round(ease(pr) * target);
    flapSet(flapRail, v.toLocaleString('en-SG'));
    if(pr < 1) requestAnimationFrame(frame);
    else { railIntroDone = true; }
  }
  requestAnimationFrame(frame);
})();

/* ── the rail pulse, 26 Aug (pass98) ─────────────────────────────────────
   Re-runs the opening SWEEP periodically so the board moves from time to time.
   It re-flips to the same figure: RAISED_RATE_HR is held at 0 on purpose, so
   an upward tick would be a rate claim we cannot evidence. If the rate ever
   goes above zero this pulse shows real growth with no other change. */
(function railPulse(){
  if(!flapRail || RM) return;
  setInterval(function(){
    if(document.hidden || !railIntroDone) return;
    var target = raisedNow(), t0 = null, DUR = 1800;
    railIntroDone = false;                       /* hands tick() off, as the intro does */
    function ease(t){ return 1 - Math.pow(1-t, 3); }
    function frame(now){
      if(t0 === null) t0 = now;
      var pr = Math.min(1, (now - t0) / DUR);
      flapSet(flapRail, Math.round(ease(pr) * target).toLocaleString('en-SG'));
      if(pr < 1) requestAnimationFrame(frame); else railIntroDone = true;
    }
    requestAnimationFrame(frame);
  }, 45000);
})();

function tick(){
  var v = raisedNow();
  /* hands off while the opening sweep is running, or it would fight it */
  if(flapRail && railIntroDone) flapSet(flapRail, v.toLocaleString('en-SG'));
  /* the At Work hero odometer reads the SAME number, on the same tick. The two
     used to be independent and disagreed by 16x — see the counter note there. */
  if(window.__nfAwxSite) window.__nfAwxSite(v);
  /* flapWall is no longer the aggregate. It belongs to the At Work estimator now
     and shows the VISITOR'S floor, not ours — see nfEstimate() below. The two used
     to render the identical number, which made the section hero a bigger copy of a
     rail widget the reader had already scrolled past on four other routes. */
  var el = Math.floor((Date.now() - VERIFIED_AT.getTime())/1000);
  verAgo.textContent = 'T+' + pad(Math.floor(el/3600)) + ':' + pad(Math.floor(el/60)%60) + ':' + pad(el%60);
}
tick();
setInterval(tick, 1000);
setInterval(cyclePos, 4500);

/* ── 4 · SPARKLINES ───────────────────────────────────────────────────── */
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function seedOf(s){ var h = 2166136261; for(var i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function drawSpark(svg){
  if(svg.getAttribute('data-drawn') === '1') return;
  svg.setAttribute('data-drawn','1');
  var key = svg.getAttribute('data-spark') || 'x';
  var rnd = mulberry32(seedOf(key));
  var N = 26, W = 200, H = 44, pts = [], v = 0.42 + rnd()*0.14;
  var drift = (key === 'drone' || key === 'ground') ? -0.002 : 0.004;
  for(var i=0;i<N;i++){
    v += (rnd() - 0.5) * 0.13 + drift;
    v = Math.max(0.14, Math.min(0.86, v));
    pts.push([ (i/(N-1))*W, H - 4 - v*(H-10) ]);
  }
  var d = 'M' + pts.map(function(p){ return p[0].toFixed(1)+' '+p[1].toFixed(1); }).join(' L');
  var ar = d + ' L' + W + ' ' + H + ' L0 ' + H + ' Z';
  var ns = 'http://www.w3.org/2000/svg';
  function mk(t,a){ var e = document.createElementNS(ns,t); for(var k in a) e.setAttribute(k,a[k]); return e; }
  svg.appendChild(mk('path',{ d:ar, 'class':'ar' }));
  svg.appendChild(mk('line',{ x1:0, y1:H-0.5, x2:W, y2:H-0.5, 'class':'base' }));
  svg.appendChild(mk('path',{ d:d, 'class':'ln' }));
  var last = pts[pts.length-1];
  svg.appendChild(mk('circle',{ cx:last[0]-1.5, cy:last[1], r:2 }));
}

/* ── 5 · REVEAL / COUNT-UP / CTA ──────────────────────────────────────── */
var io = null;

}
function observeAll(root){

  var tg = a.getAttribute('target'); if(tg && tg !== '_self') return;
  var href = a.getAttribute('href');
  var o = originFromRef(href), r = (o !== null) ? 'origins' : routeFromRef(href);
  if(r === null || (href && href.charAt(0) === '#')) return;    /* hash links have their own handler */
  ev.preventDefault();
  if(o !== null && PATHS_ON){ try{ history.replaceState(null, '', ORIGIN_META[o].path); }catch(e){} }
  if(location.hash === '#' + r) fromHash(); else location.hash = '#' + r;
});

/* running index — nearest beat to the top of the viewport */
/* THE RAIL, 24 Aug. Two things are shown, and they are deliberately different measures.
   The FILL is continuous: how far through the route's own scrollable height the reader
   is, so it moves while reading a single long beat instead of jumping once per section.
   The DOTS are discrete: which beat is current, using the same 34%-of-viewport line the
   old counter used, so the active dot changes exactly when the old number would have. */
/* ── beat positions are cached, 26 Aug (pass102) ─────────────────────────
   updateIdx measured every beat on the route on every scroll frame — seven
   rects on #work, 406 forced layouts across a 60-frame scroll. Where the beats
   ARE does not change while you scroll; only where you are does. Measured once
   per route as document coordinates and compared against scrollY, which costs
   nothing. Re-measured on resize, on route change, and whenever the section
   itself changes size (lazy images, fonts settling). */
var _idxTops = null, _idxRoute = null, _idxRO = null, _idxROinst = null, _idxSpan = null;
function idxMeasure(){
  var sec = document.getElementById(current); if(!sec) return null;
  var beats = beatList(sec); if(!beats.length) return null;
  var sy = window.__nfY || window.scrollY || 0;      /* pass111 */
  _idxTops = beats.map(function(b){ return b.getBoundingClientRect().top + sy; });
  _idxRoute = current;
  /* observe ONCE, and ignore the callback observe() fires immediately —
     rebuilding it here made measure -> observe -> invalidate -> measure, a
     loop that meant the cache never survived a frame (pass103). */
  if(window.ResizeObserver && _idxRO !== sec){
    try{
      if(_idxROinst) _idxROinst.disconnect();
      var _first = true;
      _idxROinst = new ResizeObserver(function(){
        if(_first){ _first = false; return; }
        _idxTops = null; _idxSpan = null;
      });
      _idxROinst.observe(sec);
      _idxRO = sec;
    }catch(e){}
  }
  return _idxTops;
}
window.__nfIdxInvalidate = function(){ _idxTops = null; _idxSpan = null; };
addEventListener('resize', function(){ _idxTops = null; _idxSpan = null; }, {passive:true});

function updateIdx(){
  var sec = document.getElementById(current); if(!sec) return;
  var beats = beatList(sec); if(!beats.length) return;

  var tops = (_idxRoute === current && _idxTops) ? _idxTops : idxMeasure();
  if(!tops) return;
  var sy = window.__nfY || window.scrollY || 0;      /* pass111 */
  var best = 0, mid = (window.__nfVH || window.innerHeight) * 0.34;
  for(var i=0;i<tops.length;i++){
    if(tops[i] - sy <= mid) best = i;
  }
  for(var j=0;j<idxDots.length;j++){
    idxDots[j].classList.toggle('is-done', j < best);
    idxDots[j].classList.toggle('is-on',   j === best);
  }

  if(idxFill){
    var doc = document.documentElement;
    /* pass105: cached on the same lifecycle as the beat tops. Re-read per frame
       it was a forced layout for a number that only moves when the document
       does — and the ResizeObserver on the section is what catches that. */
    if(_idxSpan === null) _idxSpan = doc.scrollHeight - window.innerHeight;
    var span = _idxSpan;
    /* a route shorter than the viewport has no travel to report — show it complete
       rather than dividing by zero and printing NaN into the style attribute */
    var p = span > 8 ? (window.__nfY || window.scrollY || 0) / span : 1;   /* pass111 */
    p = p < 0 ? 0 : p > 1 ? 1 : p;
    idxFill.style.height = (p * 100).toFixed(2) + '%';
  }
}
var idxTick = false;
window.addEventListener('scroll', function(){
  if(idxTick) return; idxTick = true;
  requestAnimationFrame(function(){ updateIdx(); idxTick = false; });
}, { passive:true });

function addToCart(o, size){
  var price = size === '1kg' ? P1KG : P250;
  for(var i=0;i<cart.length;i++){
    if(cart[i].k === o.k && cart[i].size === size){ cart[i].qty++; renderCart(); openCart(true); return; }
  }
  cart.push({ k:o.k, name:o.name, size:size, price:price, qty:1 });
  renderCart(); openCart(true);
}
/* ── the bridge the lifted picker's NFCart adapter talks to ────────────────
   The picker addresses lines by a string id and works in {name,size,price,qty};
   this cart works in {k,name,size,price,qty}. These two functions are the only
   translation, and they live HERE rather than inside the component so the
   component stays byte-for-byte what shop.html wrote. */
window.__nfCart = function(){
  return cart.map(function(l){ return {id:l.id||(l.k+'|'+l.size), name:l.name,
    size:l.size, price:l.price, qty:l.qty, color:l.color}; });
};
window.__nfCartSet = function(id, qty, meta){
  var i, found = -1;
  for(i=0;i<cart.length;i++){ if((cart[i].id||(cart[i].k+'|'+cart[i].size)) === id){ found=i; break; } }
  if(qty <= 0){ if(found>=0) cart.splice(found,1); }
  else if(found>=0){ cart[found].qty = qty; }
  else {
    /* price comes from MARKETS, not from the picker's own hardcoded card, so the
       SG / UAE toggle still governs what the shop charges */
    var size = (meta.size||'').toLowerCase();
    cart.push({ k:id, id:id, name:meta.name||'Coffee', size:meta.size||'1kg',
      price: (size.indexOf('250') >= 0 ? P250 : P1KG), qty:qty, color:meta.color });
  }
  renderCart();
  /* deliberately NOT opening the drawer here. Adding from the shop grid is a
     one-shot action and the drawer sliding in is the confirmation; adding from
     inside the origin dossier is not — the panel is full-bleed and the drawer
     would cover the thing she is still reading. The cart counter in the rail
     ticks either way, which is the confirmation that belongs to this case. */
};


/* ── STEP 4 · filling Eastspring's letter with this visitor's quote ────────
   Every id addressed here exists in that build's sheet; nothing about its
   structure changed. The machine rows are generated because ours are chosen
   rather than fixed, and the entity block follows the market toggle. */
function paintLetter(c){
  var set = function(id, txt){ var e = $('#' + id); if(e) e.textContent = txt; };
  if(!$('#qSheet')) return;

  set('qRef', QREF);
  var d = new Date();
  var human = d.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
  set('qInvDate', human); set('qInvDate2', human);
  set('qTaxLabel', MKT.tax);
  /* block 78 — an unregistered market has no tax to be "ex" of */
  (function(){ var t = $('#qTaxLabel'); if(!t) return; var n = t.previousSibling;
     if(n && n.nodeType === 3){ if(!t.__exTxt) t.__exTxt = n.textContent;
       n.textContent = MKT.tax ? t.__exTxt : t.__exTxt.replace(/Ex-\s*$/, ''); } })();
  set('qFromEntity', MKT.entity.split(' · ')[0]);
  set('qFromCity', MKT.where.replace(/^the /,''));
  var reg = $('#qEntityReg'), addr = $('#qEntityAddr');
  if(reg)  reg.textContent  = MKT.entity;
  /* block 82 — each market carries its own address line; the SG one is the
     fallback so an unpriced market never prints another market's street */
  if(addr) addr.textContent = MKT.addr || MARKETS.SG.addr;
  $$('#qSheet .qcur').forEach(function(e){ e.textContent = MKT.cur; });

  /* who it is for — taken from the access step, which is where we learned it */
  var co = $('#accCo'); if(co && co.value) set('qToCo', co.value);
  var em = $('#accEmail'); if(em && em.value) set('qToName', em.value);

  /* ── the coffee lines · block 59 ────────────────────────────────────────
     Four figures, each stated once and never re-derived on the page:
       base       what the coffee is invoiced at, before anything voluntary
       topKg      the top-up, converted from \u00a2/cup at 1000/18 g
       invoiced   base + topKg — the number on the invoice
       ngoKg      band share + topKg — the number reaching the NGOs
     The band percentage is taken on the BASE rate, per Alex's decision: a
     voluntary top-up must not push the band into the next tier and get
     counted twice. */
  var CUPS_KG = 1000/18;
  var base     = Q.price;
  var bandKg   = c.bandPerKg;
  var bandCup  = bandKg / CUPS_KG * 100;
  var topKg    = c.topPerKg, topCup = c.topCents;
  var hasTop   = topCup > 0.004;
  var invoiced = base + topKg;
  var ngoKg    = bandKg + topKg;
  var ngoCup   = ngoKg / CUPS_KG * 100;

  set('qCoffeeLine', CUR() + base.toFixed(2) + ' /kg');
  set('qCoffeeSub', 'Includes ' + bandCup.toFixed(1) + __nfCupTable().sym + '/cup built-in NGO share ('
      + window.__nfPct(c.band.rate) + '% of the rate)');

  var tuRow = $('#qTopUpRow'); if(tuRow) tuRow.hidden = !hasTop;
  var ivRow = $('#qInvoicedRow'); if(ivRow) ivRow.hidden = !hasTop;   /* block 75 — the sum line is only a sum when there are two terms */
  set('qTopUpLine', '+ ' + CUR() + topKg.toFixed(2) + ' /kg');
  /* label only — every figure on this page is still computed from 1000/18.
     FLOOR, not round: 1000/18 is 55.56, which rounds UP to 56 and would state a
     yield of one more cup than a kilo gives. 55 whole 18g doses is both the
     number Alex asked for and the true one. */
  set('qTopUpSub', '+' + topCup.toFixed(1) + __nfCupTable().sym + '/cup top-up · '
      + Math.floor(CUPS_KG) + ' cups/kg conversion');

  set('qInvoicedLine', CUR() + invoiced.toFixed(2) + ' /kg');

  set('qNgoVal', CUR() + ngoKg.toFixed(2));
  set('qNgoSub', '100% of the built-in share (' + CUR() + bandKg.toFixed(2) + '/kg)'
      + (hasTop ? ' + your top-up (' + CUR() + topKg.toFixed(2) + '/kg)' : '')
      + ' passed directly to NGO partners · ~' + ngoCup.toFixed(1) + __nfCupTable().sym + '/cup.'
      /* restoration, not an offset — see block 59 */
      + ' Includes tree planting at the Cinta Raja restoration site.');
  set('qConsBasis', Math.round(c.kgTotal * CUPS_KG * 12).toLocaleString('en-GB'));
  set('qConsAnnual', '~' + CUR() + money0(c.contrib * 12));

  /* ── 1 Sep · THE CONTRIBUTION IN THE UNIT THE COFFEE IS BOUGHT IN ───────
     See block 54. Both figures come from numbers already on this page; the
     only new thing is that they are now printed. */
  /* the headline pair · block 59 — the invoiced rate leads, the split sits
     under it, so the first number a finance reader meets is the billed one */
  set('qHeroCoffee', invoiced.toFixed(2));
  set('qHeroCoffeeNote', 'Total invoiced coffee rate');

  /* the machine lines, one per configured unit */
  var host = $('#qMachRows');
  if(host){
    host.textContent = '';
    MACHINES.forEach(function(m){
      var q = Q.m[m.k].q; if(!q) return;
      var cfgm = Q.m[m.k];
      var row = document.createElement('div');
      row.className = 'q-line';
      /* 30 Aug: this row used to print m.price (the "From" figure) as the unit
         label next to a total that had a term discount applied to it — the same
         line contradicting itself. Both halves now read the SAME rate, and a
         purchase is no longer stamped "/mo". */
      var isBuy = cfgm.mode === 'purchase';
      var unit  = isBuy ? buyTotal(m, cfgm) : machRate(m, cfgm.term);
      row.innerHTML = '<div class="q-lab">' + m.name +
        ' <span class="q-sub">' + q + ' × ' + CUR() + money(unit) + ' · '
        + cfgm.term + '-month ' + cfgm.mode + '</span></div>' +
        '<div class="q-val">' + CUR() + money(unit * q) +
        '<span class="q-unit">' + (isBuy ? ' one-off' : ' /mo') + '</span></div>';
      host.appendChild(row);
    });
    if(!host.children.length){
      var none = document.createElement('div');
      none.className = 'q-line';
      none.innerHTML = '<div class="q-lab">No machines selected <span class="q-sub">coffee supply only</span></div>'
                     + '<div class="q-val">—</div>';
      host.appendChild(none);
    }
  }
  /* ── what is actually included, per the CONFIGURED fleet ──────────────
     These rows described a rental and nothing else. With machines on the
     sheet in both modes they have to say which is which, or the sheet
     contradicts its own machine block one screen above. */
  (function syncInclusions(){
    var rent = 0, buy = 0, coolBought = 0, svcBought = 0, wrapTaken = 0;
    MACHINES.forEach(function(mm){
      var st = Q.m[mm.k]; if(!st.q) return;
      if(st.mode === 'purchase'){
        buy += st.q;
        if(st.cooler) coolBought += st.q;
        if(st.svc)    svcBought  += st.q;
        if(st.wrap)   wrapTaken  += st.q;
      } else rent += st.q;
    });
    var units = rent + buy, mixed = rent > 0 && buy > 0;

    var setv = function(id, t){ var e = $(id); if(e) e.textContent = t; };

    setv('#qIncHd', !units ? 'Included with the partnership'
                 : buy && !rent ? 'Included with the partnership · purchased units are itemised above'
                 : mixed ? 'Included with the partnership · on the rented units'
                 : 'Included with the partnership');

    /* coolers: free on a rental, a chosen line item on a purchase */
    var cool = $('#qCoolerLine');
    if(cool) cool.textContent = !units ? '—'
      : buy && !rent ? (coolBought ? coolBought + ' × Charged above' : 'Not taken')
      : mixed ? (rent + ' × Included · ' + coolBought + ' charged above')
      : units + ' × Included';
    var cs = $('#qCoolerSub');
    if(cs) cs.textContent = buy ? '1 per machine · free on rental, ' + CUR() + money(buyExtras().cooler) + ' on a purchase'
                                : '1 per machine · ' + units + ' included';

    /* the impact counter — the one thing that used to be unbuyable */
    setv('#qTabletVal', !units ? '1 × Included'
      : buy && !rent ? 'Included with the cooler & servicing plan'
      : mixed ? rent + ' × Included · purchased units per the block above'
      : units + ' × Included');

    /* block 63 — flag the rows that are NOT inclusions, so the tick in the
       margin can become a dash on them. Driven by the same branch that writes
       the value; nothing infers state from the printed words. */
    var mark = function(sel, on){ var e = $(sel); if(e) e.classList.toggle('is-off', !on); };
    mark('#qRowTablet',  !(buy && !rent));

    /* the wrap */
    setv('#qCobrandVal', !units ? 'Included'
      : buy && !rent ? (wrapTaken ? 'Included · 2-year coffee commitment' : 'Not taken')
      : mixed ? 'Included' : 'Included');

    /* servicing — the row a buyer is most likely to read as free */
    setv('#qFleetVal', !units ? 'Included'
      : buy && !rent ? (svcBought ? 'Purchased · see servicing plan above' : 'NOT INCLUDED — plan declined')
      : mixed ? 'Included on the rented units' : 'Included');
    /* block 59 — and its sub-line follows it. Alex's copy said "every 4 months"
       flat; the real cadence is twice-yearly in years one and two and
       four-monthly in year three, and on a purchase with no plan there is no
       cadence at all. A schedule printed over a declined plan is the one thing
       on this card that could be read as a commitment. */
    mark('#qRowCobrand', !(buy && !rent && !wrapTaken));
    mark('#qRowFleet',   !(buy && !rent && !svcBought));
    setv('#qFleetSub', (buy && !rent && !svcBought)
        ? 'Sold separately · no servicing plan taken on this quote'
        : 'Scheduled maintenance every 4 months · Parts and labor included');

    /* the lease line under the equipment figure — term read from what is
       actually on the quote, inclusions named only where they are free */
    var term = 0;
    MACHINES.forEach(function(mm){ var st = Q.m[mm.k];
      if(st.q && st.mode !== 'purchase' && !term) term = st.term; });
    window.__nfLeaseTerm = term;
  })();
  set('qFleetTotal', money(c.machMonthly));
  /* 31 Aug — this said "coolers & servicing included" over a PURCHASE figure,
     which is exactly backwards: on a purchase they are line items, not inclusions. */
  set('qHeroEquipNote', c.capex > 0
      ? ('plus ' + CUR() + money(c.capex) + ' one-time')
      : (c.units
          ? (window.__nfLeaseTerm || 36) + '-month equipment lease'
          : 'Via our leasing partner'));
}

       entirely". I would have agreed if they were inert, but they are not:

       reader unable to reach the cheaper configuration.

      var rowsHost = $('[data-inclrows]', box);

        { k:'calib',  nm:'Machine servicing', fixed:true, buy:0,

      var rent = isBuy ? (machRate(m, BUY_TERM) * BUY_TERM)

      var sum = $('[data-inclsum]', box), h, open = !!c.__open, tot = 0;
      if(isBuy){

        /* 31 Aug (3) — "YOURS TO OWN" NO LONGER PRINTS WHEN THE PANEL IS SHUT.

      } else {

      if(mode === 'purchase' && !c.__buyInit){

       own forward action, so two buttons compete for the same press and one of
       them silently abandons the configuration in progress. In August I argued

       overlap. why are you constantly failing on this?"

       proxy is position:fixed: it is measured against the viewport once, here,
       and then flies between two viewport positions. If the deck is still
       smooth-scrolling from the PREVIOUS action — a disclosure settling, a
       closed panel returning to the row — the row slides up underneath a proxy

       screenshot he sent shows exactly that: geometry from one scroll
       position, painted over another. And every one of my traces started from
       rest, which is why they all came back "34px clear".

    /* ── 1 Sep · THE PROXY HAS TO BECOME THE PANEL, NOT VANISH INTO IT ──────

       for the whole feel. In openDossier the proxy's background is set to

           '<div class="cx-dsheet" style="background:' + c.color + '">'

       dossier; the cloned card fades off the top of it, and when the proxy is
       switched off at landing there is nothing to see, because what was under
       it was the same colour all along.

       one place (landed(), behind an `if(openK !== k) return`), and anything

       because close_() could only restore what it could still find.

       examining code used for 'find out more'."

       the instant the proxy is placed —

           inlineCard.style.opacity = '0';

       while this hides a permanent card in a comparison row, and my restore

       left a hole in the row. That was "the vanishing card".

         one it thinks it hid, so no bookkeeping can be wrong.

         which depends on the flight having gone as planned.

       resting tiles above ... the transition is simply wrong and not clearing
       the tiles when it begins animation."

       He is right, and I had it backwards. I traced the coffee flight properly
       this time instead of reasoning about it, and the numbers say plainly why
       it never crosses anything:

         .cx-viewport during openDossier ...... {t:0, b:0, w:0, h:0}
         .cx-detailcard (the flight's origin) . {t:153, h:539}
         morph top over the flight ............ 153 -> 736

       descends through empty space. There is nothing to cross. The animation I
       built descends 600px straight through three intact neighbours, because
       our reader presses Configure from the row itself with no detail step in

       expands. Fading the GRID rather than the cards one by one is deliberate:
       its box keeps its size so nothing reflows, the origin card goes with it

       over-correction: blanking all four cards to protect three that were
       never in danger. The geometry says why they never were — the proxy is
       one column wide (321px) and descends inside its own column's x-range;
       the expand begins below the row's bottom edge. The only thing the
       flight can cross is the origin card's own body and the empty strip
       under it.

       last, exactly like the coffee tiles. The lift-then-drop beat, the

         the rule that ended the vanishing-card and overlap bugs alike. */

         the row" by now. Alex's flight recorder, run on HIS machine on the
         coffee flow, ended that reasoning: the coffee row reads

           than the geometry and started 60ms in, so the colour has settled

       flying while the row it left was still fully painted, and the row did
       not reach 0 until the card was half way through it (rowOpacity .52 at

       flow on landing — but its own code guards that with

  function close_(){

         reexplore other options, it's clunky."

         card's own minus button had been replaced by the "xN Edit" pill — so
         once a machine was configured there was no control anywhere that could
         un-configure it. The only way out was switching to Rental and back.
         The stepper floors at 0 now: hitting zero drops the machine from the

      cfg.q = Math.max(0, Math.min(20, cfg.q + parseInt(t.getAttribute('data-nfbd-q'), 10)));

         saving line refuses to appear while one is open. */
      if(n === 0){ cfg.svc = false; }
      else {

           wrapCost() ALREADY CHARGES ZERO FOR IT AT THOSE LENGTHS. But the
           quote sheet lists what cfg.wrap says, so leaving the flag off meant
           the panel promising a wrap the quote would not mention and we would
           never ship. Caught in the interaction test. Turning it on costs
           nothing (wrapCost is 0 here) and makes the promise real; the buyer

        if(n >= 3){ cfg.wrap = true; cfg.counter = true; }

  });

     the cards so it runs AFTER each card's own [data-q] handler has already
     updated the count; this listener only reacts to the result. */

  if(host) host.addEventListener('click', function(e){

       bug. This listener used to sit on the bubble phase, which runs AFTER the
       card's own [data-q] handler. That handler calls recalc(), and __paint
       rewrites [data-addzero]'s innerHTML — so if the reader happened to press
       the PRICE half of the Add pill, e.target was destroyed before this ran,
       e.target.closest() returned null on the orphan, and pressing Add did
       nothing at all. Pressing the word "Add" worked, because .mx-cta is not
       inside the rewritten span. A control that works or not depending on which
       half of it you hit is the same fault this file has already logged twice:
       "__paint rewrites the rows on every repaint".

       ACTION is deferred to the next frame, by which time the card's handler
       has updated the count this decision depends on. */

    if(!t) return;

    var k = card.getAttribute('data-m'); if(!k || !Q.m[k]) return;

      if(!Q.m[k]) return;

         and the card's rental tail comes back underneath it. Caught in the
         stress run: switching back to Rental left the dark sheet sitting under
         a row of rental cards, describing a configuration no longer on offer. */
      if(Q.m[k].mode !== 'purchase' || Q.m[k].q < 1){ if(openK === k) close_(); return; }

         asked for a machine yet, and a panel that appears unbidden is the
         clutter this whole pass has been removing */
      if(isMode) return;

  MACHINES.forEach(function(m){
    var card = document.querySelector('.q-eq-card[data-m="' + m.k + '"]');

      if(this.style.opacity !== '') this.style.opacity = '';

/* block 109 — the reader's volume, from the one control that sets it */
window.__nfVolCups = function(){ var vs = document.getElementById('volCups'); return vs ? (+vs.value || 0) : 43000; };
window.__nfVolKg = function(picks){
  if(!picks) return 0;
  return Math.round(window.__nfVolCups() * 18 / 1000 / 12 * 10) / 10;      /* kg a month at 18 g a cup */
};
function compute(){
  var kgTotal = 0, coffeeLines = [];
  var picked = ORIGINS.filter(function(o){ return !!Q.kg[o.k]; });
  var kgAll = window.__nfVolKg(picked.length);
  var share = picked.length ? Math.round(kgAll / picked.length * 10) / 10 : 0;
  picked.forEach(function(o){
    kgTotal += share;
    coffeeLines.push({ n: o.name + ' · ' + share + ' kg', v: share * Q.price });
  });
  kgTotal = Math.round(kgTotal * 10) / 10;
  var coffee = kgTotal * Q.price;
  var band = bandFor(Q.price);
  var bandPerKg = Q.price * band.rate;                 /* the rate, per kg */
  /* block 58 — the instrument's top-up, converted from cents per 18g cup to a
     price per kilo using the dose every figure in this file derives from */
  var topCents  = +(window.__nfTopUpCents || 0);
  var topPerKg  = topCents / 100 * (1000/18);
  var contrib = kgTotal * (bandPerKg + topPerKg);

  var machMonthly = 0, capex = 0, units = 0, machLines = [], rentEquiv = 0, buyGaps = 0;
  var svcLines = [];                                             /* block 104 */
  MACHINES.forEach(function(m){
    var s = Q.m[m.k]; if(!s.q) return;
    units += s.q;
    /* block 104 — servicing is not a control, it is the consequence of the
       mode and the options: stated here once, in the words the reader gets */
    svcLines.push(m.name + ' · ' + (s.mode === 'rental'
      ? 'included with the rental'
      : (s.svc ? (s.svcYrs || 1) + ' year' + ((s.svcYrs || 1) > 1 ? 's' : '') + ' of cover \u00b7 parts, labour and breakdown'
               : (s.svc1 ? 'year one only' : 'not included'))));
    if(s.mode === 'rental'){
      var per = machRate(m, s.term);
      machMonthly += per * s.q;
      machLines.push({ n: m.name + ' × ' + s.q + ' · rental ' + s.term + ' mo · ' + CUR() + money(per) + '/mo each',
                       v: per * s.q, kind:'mo' });
    } else {
      /* Outright is a PRICE, not a multiple of a rental rate — it does not move
         with the term. What the term governs is how many years of the servicing
         plan come with it, and that plan runs from day one (see buyExtras()).

         31 Aug — this branch used to publish ONE number: the machine. Alex:
         "cheaper when factoring in what they'll need to buy? which are the
         servicings, decal etc?" It was not. A renter is given the cooler, the
         install, the full service schedule, the callouts, the livery wrap and
         the impact counter; a buyer has to go and buy five of those six and
         cannot buy the sixth. Quoting the machine alone against a rental that
         bundles all of it is not a comparison, so every line is itemised below
         and the rental equivalent is totalled beside it. */
      var x = buyExtras(), yrs = (s.svcYrs || 1);
      /* every declined add-on is a thing the rental beside this quote hands over
         free, so the buy-vs-rent line below must stop calling itself like-for-like.
         Only the two that carry a real cost count: the wrap and the counter are
         free on these terms, so declining them changes nothing to compare. */
      if(!s.cooler) buyGaps++;
      if(!s.svc)    buyGaps++;

      var cool = s.cooler  ? x.cooler      : 0;
      var svc  = s.svc     ? svcPlanCost(m, yrs) : 0;
      var svc1 = (!s.svc && s.svc1) ? x.svc1      : 0;
      var wrp  = s.wrap    ? wrapCost(x, s) : 0;
      var ctr  = s.counter ? counterCost(x, s)    : 0;
      /* Install is the one charge that is NOT optional: we do not leave a
         bean-to-cup machine at reception. Everything else the buyer chooses. */
      var base = m.buy + x.install;
      var cap  = (base + cool + svc + wrp + ctr) * s.q;
      capex += cap;
      rentEquiv += machRate(m, s.term) * s.term * s.q;

      machLines.push({ n: m.name + ' × ' + s.q + ' · outright purchase', v: cap, kind:'cap' });
      /* the BASELINE first, then each option layered on top of it — Alex, 31 Aug:
         "purchase needs to state the baseline purchase price but then layer the
         options". The machine and its install are the baseline; nothing below
         this line is something the reader has not chosen. */
      machLines.push({ n: 'Machine · ' + CUR() + money(m.buy)
                         + (x.install ? ' + install ' + CUR() + money(x.install)
                                      : ' · install included')
                         + ' · baseline',
                       v: base * s.q, kind:'cap', sub:true });

      if(s.cooler) machLines.push({ n: '+ Milk cooler', v: cool * s.q, kind:'cap', sub:true });
      else         machLines.push({ n: 'Milk cooler · DECLINED (' + CUR() + money(x.cooler)
                                      + ' each) · no fresh-milk drinks without one', v:null, kind:'note', sub:true });

      if(s.svc) machLines.push({ n: '+ Servicing plan · ' + yrs + ' yr × ' + CUR() + money(x.svcYr)
                                   + ' · parts, labour and breakdown cover included',
                                 v: svc * s.q, kind:'cap', sub:true });
      else      machLines.push({ n: 'Servicing plan · DECLINED (' + CUR() + money(x.svcYr * yrs)
                                   + ' each) · parts and breakdowns become theirs', v:null, kind:'note', sub:true });

      if(s.wrap) machLines.push({ n: '+ Livery wrap' + (wrp ? '' : ' · FREE on a ' + s.term
                                     + '-month term (2-year coffee commitment)'),
                                  v: wrp ? wrp * s.q : null, kind: wrp ? 'cap' : 'note', sub:true });
      else       machLines.push({ n: 'Livery wrap · not taken · free on this term', v:null, kind:'note', sub:true });

      if(s.counter) machLines.push({ n: '+ Live impact counter' + (ctr ? '' : ' · FREE with the cooler and servicing plan'),
                                     v: ctr ? ctr * s.q : null, kind: ctr ? 'cap' : 'note', sub:true });
      else          machLines.push({ n: 'Live impact counter · not taken ('
                                       + CUR() + money(x.counter) + ' alone, free with cooler + servicing)',
                                     v:null, kind:'note', sub:true });

      /* Never a line item in either direction: a rate, not an amount. */
      machLines.push({ n: 'Ad-hoc callouts · ' + CUR() + money(x.calloutBase) + ' + '
                         + CUR() + money(x.calloutHr) + '/hr as they occur · included on a rental',
                       v: null, kind:'note', sub:true });
    }
  });
  return { kgTotal:kgTotal, coffee:coffee, band:band, contrib:contrib,
           bandPerKg:bandPerKg, topCents:topCents, topPerKg:topPerKg,
           machMonthly:machMonthly, capex:capex, units:units, svcLines:svcLines,   /* block 104 */
           /* what the PURCHASED units would have cost to rent over the same
              term — the only honest thing to hold the capex figure against */
           rentEquiv:rentEquiv, buyGaps:buyGaps,
           coffeeLines:coffeeLines, machLines:machLines,
           total: machMonthly + coffee };
}

var linesHost = $('#quoteLines');
function recalc(){
  var c = compute();

  ORIGINS.forEach(function(o){
    /* the row is a picker tile now, not a table row — same data attribute */
    var row = $('.qcx-cell[data-o="' + o.k + '"]') || $('.orow[data-o="' + o.k + '"]');
    if(!row) return;
    var kv = $('.kgv', row); if(kv) kv.textContent = String(Q.kg[o.k]);
    row.classList.toggle('act', Q.kg[o.k] > 0);
  });
  MACHINES.forEach(function(m){
    var card = $('.q-eq-card[data-m="' + m.k + '"]') || $('.mcard[data-m="' + m.k + '"]');
    if(!card) return;
    var qv = $('.qv', card); if(qv) qv.textContent = String(Q.m[m.k].q);
    if(card.__paint) card.__paint();
    card.classList.toggle('act', Q.m[m.k].q > 0);
  });

  $('#kgTotalHd').textContent = c.kgTotal + ' KG / MO';
  $('#machHd').textContent = c.units + (c.units === 1 ? ' UNIT' : ' UNITS');
  $('#priceVal').textContent = Q.price.toFixed(2);
  if(window.__qxSync) window.__qxSync();
  /* the deck's running total reads the same numbers this console does */
  window.__nfQ = Q;
  if(window.__nfDeckTally) window.__nfDeckTally(c);
  /* ES's machines CTA: with no machines picked the step is skippable, and the
     button says so (deck-next--skip is ES's own class, already in the sheet) */
  (function(){
    var mb = document.querySelector('.deck-screen[data-screen="1"] .deck-next');
    if(!mb) return;
    var skip = !c.units;
    mb.textContent = skip ? 'Skip machines \u2192' : 'Confirm machines \u2192';
    mb.classList.toggle('deck-next--skip', skip);
  })();
  paintLetter(c);
  $('#rateVal').textContent = (c.band.rate * 100).toFixed(1);
  $('#bandHd').textContent = c.band.label;
  $('#contribRate').textContent = (c.band.rate * 100).toFixed(1) + '%';
  $$('.band').forEach(function(b){
    b.classList.toggle('on', parseInt(b.getAttribute('data-band'),10) === c.band.id);
  });

  /* step-up ledger — what moving up the band costs and what it buys */
  var su = $('#stepUp'), st = $('#stepState');
  su.textContent = '';
  function line(txt, sig){
    var d = document.createElement('div');
    d.textContent = txt;
    if(sig) d.style.color = 'var(--signal)';
    su.appendChild(d);
  }
  if(c.kgTotal === 0){
    st.textContent = 'NO VOLUME';
    line('Set a coffee volume in Module A to see the step-up ledger.');
  } else if(c.band.id < 3){
    var next = BANDS[c.band.id];
    var nPrice = next.from;
    var nCoffee = c.kgTotal * nPrice, nContrib = nCoffee * next.rate;
    st.textContent = 'STEP AVAILABLE';
    line('AT ' + CUR() + Q.price.toFixed(2) + '/KG  →  COFFEE ' + CUR() + money(c.coffee) + '/MO  ·  TO NGO ' + CUR() + money(c.contrib) + '/MO');
    line('AT ' + CUR() + nPrice.toFixed(2) + '/KG  →  COFFEE ' + CUR() + money(nCoffee) + '/MO  ·  TO NGO ' + CUR() + money(nContrib) + '/MO');
    line('COSTS  +' + CUR() + money(nCoffee - c.coffee) + '/MO   BUYS  +' + CUR() + money(nContrib - c.contrib) + '/MO TO THE FOREST', true);
  } else {
    var floorP = BANDS[0].from;
    var fCoffee = c.kgTotal * floorP, fContrib = fCoffee * BANDS[0].rate;
    st.textContent = 'FULL RATE';
    line('AT THE FLOOR ' + CUR() + floorP.toFixed(2) + '/KG  →  COFFEE ' + CUR() + money(fCoffee) + '/MO  ·  TO NGO ' + CUR() + money(fContrib) + '/MO');
    line('YOU ARE AT ' + CUR() + Q.price.toFixed(2) + '/KG  →  COFFEE ' + CUR() + money(c.coffee) + '/MO  ·  TO NGO ' + CUR() + money(c.contrib) + '/MO');
    line('COSTS  +' + CUR() + money(c.coffee - fCoffee) + '/MO   BUYS  +' + CUR() + money(c.contrib - fContrib) + '/MO TO THE FOREST', true);
  }

  /* line items */
  linesHost.textContent = '';
  var any = c.coffeeLines.length || c.machLines.length;
  if(!any){
    var e = document.createElement('div');
    e.className = 'qempty'; e.textContent = 'AWAITING INPUT — PICK A COFFEE OR A MACHINE.';
    linesHost.appendChild(e);
  } else {
    var add = function(n, v, cls){
      var d = document.createElement('div');
      d.className = 'qline' + (cls ? ' ' + cls : '');
      d.innerHTML = '<span class="qn"></span><span class="qv"></span>';
      d.firstChild.textContent = n;
      d.lastChild.textContent = v;
      linesHost.appendChild(d);
      requestAnimationFrame(function(){ d.classList.add('in'); });
      return d;
    };
    if(c.machLines.length){
      add('Machines', '', 'sub');
      c.machLines.forEach(function(l){
        /* kind 'note' carries no figure: it names something the reader is NOT
           being charged for here but WOULD have to pay for, or cannot buy at
           all. Printing it as money would be a lie; omitting it would be worse. */
        var val = l.kind === 'note' ? '—'
                : CUR() + money(l.v) + (l.kind === 'mo' ? ' /mo' : ' once');
        add(l.n, val, (l.sub ? 'qitem' : '') + (l.kind === 'note' ? ' qnote' : ''));
      });
      if(c.machMonthly > 0) add('Machine subtotal / month', CUR() + money(c.machMonthly), 'sub');
      /* the comparison Alex asked for: the same units, same term, rented */
      if(c.rentEquiv > 0){
        add('Renting the same units for the same term',
            CUR() + money(c.rentEquiv) + ' total', 'sub');
        var diff = c.rentEquiv - c.capex;
        add(diff >= 0 ? 'Buying costs less by' : 'Buying costs more by',
            CUR() + money(Math.abs(diff)), 'sub');
        /* the comparison is only honest while the purchase actually matches what
           the rental gives. The moment a cooler or a servicing plan is declined,
           the two columns stop describing the same thing and the line says so. */
        if(c.buyGaps > 0){
          add('Not like-for-like — ' + c.buyGaps + ' item' + (c.buyGaps > 1 ? 's' : '')
              + ' declined that a rental includes', '—', 'qitem qnote');
        }
      }
    }
    if(c.coffeeLines.length){
      add('Coffee · ' + CUR() + Q.price.toFixed(2) + '/kg', '', 'sub');
      c.coffeeLines.forEach(function(l){ add(l.n, CUR() + money(l.v) + ' /mo'); });
      add('Coffee subtotal / month', CUR() + money(c.coffee), 'sub');
    }
    add('Conservation contribution · ' + window.__nfPct(c.band.rate) + '%',
        CUR() + money(c.contrib) + ' /mo', 'sub');
  }

  rollSet($('#rollTotal'), money(c.total));
  rollSet($('#rollCapex'), money(c.capex));
  rollSet($('#rollContrib'), money(c.contrib));
  $('#contribYr').textContent = money0(c.contrib * 12);
  return c;
}
recalc();
