<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEST — monocrop → agroforestry flash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;900&family=Archivo:wght@0,400;0,500;0,600;0,700&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{ --or:#ed3326; --cr:#F4F2EE; --pa:#EDE7D9; --nb:#1A1815; --font-display:"Big Shoulders Display",sans-serif; --font-b:"Archivo",Arial,sans-serif; --font-m:"IBM Plex Mono",monospace; --font-s:"Source Serif 4",Georgia,serif; }
*{box-sizing:border-box;} body{margin:0;font-family:var(--font-b);background:var(--pa);color:var(--nb);}
.spacer{height:60vh;display:flex;align-items:center;justify-content:center;font-family:var(--font-m);font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:#8a8378;}

/* ═══ monocrop → agroforestry flash band ═══ */
.maf{position:relative;min-height:86vh;display:flex;align-items:center;overflow:hidden;background:#14110d;color:#fff;}
.maf-media{position:absolute;inset:0;z-index:0;}
.maf-agro{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .55s ease;}
.maf-mono{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;}   /* flashed in by JS */
.maf-scrim{position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(20,17,13,.86) 0%,rgba(20,17,13,.5) 55%,rgba(20,17,13,.2) 100%);opacity:.5;transition:opacity .6s ease;}
.maf.lit .maf-agro{opacity:1;}
.maf.lit .maf-scrim{opacity:1;}

.maf-inner{position:relative;z-index:2;width:100%;max-width:1160px;margin:0 auto;padding:0 clamp(28px,6vw,110px);}
.maf-eyebrow{font-family:var(--font-m);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#ffb9a6;margin-bottom:16px;}
.maf-head{font-family:var(--font-display);font-weight:900;text-transform:uppercase;line-height:.94;letter-spacing:-.015em;font-size:clamp(34px,6vw,84px);margin:0;color:#fff;}
.maf-hot{color:var(--or);transition:color .2s;}
.maf.flashing .maf-hot{color:#fff;}
.maf-sub{font-family:var(--font-s);font-size:clamp(18px,2vw,26px);color:rgba(255,255,255,.9);margin:22px 0 0;max-width:34ch;
  opacity:0;transform:translateY(10px);transition:opacity .6s ease .15s,transform .6s ease .15s;}
.maf.lit .maf-sub{opacity:1;transform:none;}
.maf-sub .o{color:var(--or);font-style:italic;}

/* test harness */
.th-bar{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;gap:14px;align-items:center;justify-content:center;padding:10px;background:rgba(6,5,4,.92);color:#fff;font-family:var(--font-m);font-size:11px;letter-spacing:.05em;}
.th-bar button{font-family:var(--font-m);font-size:11px;letter-spacing:.08em;text-transform:uppercase;background:var(--or);color:#fff;border:none;border-radius:7px;padding:8px 15px;cursor:pointer;}
.th-bar select{font-family:var(--font-m);font-size:11px;padding:4px;}
.th-bar .n{opacity:.6;}
</style>
</head>
<body>

<div class="spacer">↓ scroll — the flash fires once when the band enters view ↓</div>

<section class="maf" id="maf">
  <div class="maf-media">
    <video class="maf-agro" id="mafAgro" src="atwork-loop.mp4" poster="atwork-loop-poster.jpg" muted loop playsinline preload="auto"></video>
    <div class="maf-mono" id="mafMono" style="background-image:url('coffee-plantation.jpg')"></div>
    <div class="maf-scrim"></div>
  </div>
  <div class="maf-inner">
    <div class="maf-eyebrow">What most coffee does</div>
    <h2 class="maf-head">Most coffee is grown<br>where it&rsquo;s <span class="maf-hot">cheapest</span>.</h2>
    <p class="maf-sub">Ours grows where it <span class="o">matters most</span> &mdash; on the standing edge, under canopy.</p>
  </div>
</section>

<div class="spacer">↑ that's the beat ↑</div>

<div class="th-bar">
  <span class="n">TEST — monocrop → agroforestry flash · is it too much?</span>
  <label class="n">monocrop:
    <select id="monoPick">
      <option value="coffee-plantation.jpg">coffee plantation</option>
      <option value="deforestation-image.jpg">deforestation</option>
    </select>
  </label>
  <button id="replay" type="button">&#9654; Replay</button>
</div>

<script>
(function(){
  var maf   = document.getElementById('maf');
  var agro  = document.getElementById('mafAgro');
  var mono  = document.getElementById('mafMono');
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  var done = false;

  function reset(){
    done = false;
    maf.classList.remove('lit','flashing');
    mono.style.opacity = '0';
    try{ agro.pause(); agro.currentTime = 0; }catch(e){}
  }

  function run(){
    if(done) return; done = true;
    if(reduce){ maf.classList.add('lit'); var p=agro.play(); if(p&&p.catch)p.catch(function(){}); return; }
    maf.classList.add('flashing');
    // two quick monocrop blinks (well under the seizure-safe 3/sec limit)
    var blinks = [[0,'1'],[130,'0'],[270,'1'],[450,'0']];
    blinks.forEach(function(b){ setTimeout(function(){ mono.style.opacity = b[1]; }, b[0]); });
    // then reveal the agroforestry loop and settle
    setTimeout(function(){
      maf.classList.remove('flashing');
      maf.classList.add('lit');
      var p = agro.play(); if(p && p.catch) p.catch(function(){});
    }, 450);
  }

  if('IntersectionObserver' in window){
    var io = new IntersectionObserver(function(es){ es.forEach(function(e){ if(e.isIntersecting){ io.disconnect(); run(); } }); }, { threshold: 0.55 });
    io.observe(maf);
  } else { run(); }

  document.getElementById('monoPick').addEventListener('change', function(){ mono.style.backgroundImage = "url('" + this.value + "')"; });
  document.getElementById('replay').addEventListener('click', function(){ reset(); requestAnimationFrame(run); });
})();
</script>
</body>
</html>
