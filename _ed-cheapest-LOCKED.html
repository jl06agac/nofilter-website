<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NoFilter — "Grown where it's cheapest" · locked</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;900&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
/* ===================================================================
   "Grown where it's cheapest" — LOCKED editorial opener
   Composition locked from _test-ed-sandbox-cheapest.html:
   x:206px  y:-2px  scale:1.23  width:580px  opacity:1
   (≈713px rendered — under the 960px native res, so the SD mono clip
    holds up crisp; full-bleed was the thing softening it.)
   =================================================================== */
:root{--or:#ed3326;--cr:#F4F2EE;--nb:#1A1815;--gy:#8a8378;--ink2:#3D3E3D;
  --d:"Big Shoulders Display",sans-serif;--m:"IBM Plex Mono",monospace;--s:"Source Serif 4",Georgia,serif;
  /* locked frame transform */
  --vx:206px; --vy:-2px; --vs:1.23; --vw:580px; --vo:1;}
*{box-sizing:border-box;} body{margin:0;background:var(--cr);color:var(--nb);font-family:var(--s);-webkit-font-smoothing:antialiased;}
.stage{position:relative;min-height:100vh;padding:clamp(70px,10vw,150px) clamp(24px,5vw,72px) 90px;overflow:hidden;}
.copy{position:relative;z-index:2;max-width:min(52vw,720px);}
.kicker{display:flex;align-items:center;gap:16px;font-family:var(--m);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--or);margin:0 0 30px;max-width:30ch;}
.kicker::after{content:"";flex:1;height:1px;background:rgba(237,51,38,.35);}
.hed{font-family:var(--d);font-weight:900;text-transform:uppercase;line-height:.88;letter-spacing:-.015em;font-size:clamp(48px,7.2vw,120px);margin:0;}
.hed .o{color:var(--or);}
.lede{font-family:var(--s);font-size:clamp(17px,1.4vw,21px);line-height:1.6;color:var(--ink2);margin:30px 0 0;max-width:46ch;}
.lede .drop{float:left;font-family:var(--d);font-weight:900;font-size:3em;line-height:.72;padding:6px 12px 0 0;color:var(--nb);}
.byline{font-family:var(--m);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gy);margin:34px 0 0;}

/* the locked monoculture frame */
.vidbox{position:absolute;left:50%;top:50%;z-index:1;width:var(--vw);aspect-ratio:16/10;
  transform:translate(-50%,-50%) translate(var(--vx),var(--vy)) scale(var(--vs));transform-origin:center center;
  box-shadow:0 30px 80px -40px rgba(26,24,21,.55);background:#0c0c0b;overflow:hidden;}
.vidbox video{width:100%;height:100%;object-fit:cover;display:block;opacity:var(--vo);
  filter:grayscale(.72) contrast(1.14) brightness(.9) sepia(.32) hue-rotate(165deg) saturate(1.05);}
.vidbox .cap{position:absolute;left:14px;bottom:12px;font-family:var(--m);font-size:10px;letter-spacing:.06em;color:#F4F2EE;text-shadow:0 1px 6px rgba(0,0,0,.7);}

/* mobile fallback — stack, contained, no absolute transform */
@media(max-width:900px){
  .stage{padding-bottom:60px;}
  .copy{max-width:none;}
  .vidbox{position:relative;left:auto;top:auto;width:100%;max-width:640px;margin:40px auto 0;transform:none;}
}
</style>
</head>
<body>

<section class="stage">
  <div class="copy">
    <p class="kicker">What most coffee does</p>
    <h1 class="hed">Grown where<br>it's <span class="o">cheapest.</span></h1>
    <p class="lede"><span class="drop">T</span>he truth is most of the coffee we drink comes from mega-farms &mdash; land as far as the eye can track, ruthlessly efficient, mechanised and maximised for profit.</p>
    <p class="byline">NoFilter &middot; Field note 01 &middot; On the cost of cheap</p>
  </div>

  <div class="vidbox">
    <video src="mono-coffee-long.mp4" muted loop playsinline autoplay preload="auto"></video>
    <span class="cap">Fig. 01 · Monoculture, to the horizon</span>
  </div>
</section>

<script>
(function(){
  document.querySelectorAll('video').forEach(function(v){ var p=v.play&&v.play(); if(p&&p.catch)p.catch(function(){}); });
})();
</script>
</body>
</html>
